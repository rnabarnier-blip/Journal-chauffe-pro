<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Chauffes Pro">
<meta name="theme-color" content="#7a2e3e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Chauffes Pro</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout : une colonne étroite, en-tête collant ; accueil = liste des chauffes ; une chauffe = 4 onglets. Grosses zones tactiles. */
:root{
  --bg:#f3efef; --surface:#ffffff; --sunk:#e9e2e3; --line:#d8cdcf;
  --fg:#241d1f; --muted:#665b5e; --accent:#7a2e3e; --accent-ink:#ffffff; --accent-soft:#f1dde2;
  --ok:#2f6b45; --ok-soft:#d8e9dd;
  --warn:#9a5a06; --warn-soft:#f6e6c9; --bad:#a3322a; --bad-soft:#f5dcd9;
  --s-in:#1f7a45; --s-ext:#2f6fc0;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#181314; --surface:#221b1d; --sunk:#2c2326; --line:#433639;
  --fg:#efe7e8; --muted:#ab9da0; --accent:#e0939f; --accent-ink:#1d1012; --accent-soft:#45262d;
  --ok:#6fbf8a; --ok-soft:#24402e;
  --warn:#e3a54a; --warn-soft:#3a2d17; --bad:#ec8a80; --bad-soft:#3d2220;
  --s-in:#3fa866; --s-ext:#5b8fe0; color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;display:grid;gap:10px}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.title-row .left{display:flex;align-items:center;gap:8px;min-width:0}
h1{font-family:var(--f-display);font-weight:700;font-size:28px;letter-spacing:.01em;margin:0;line-height:1.1;text-wrap:balance;overflow-wrap:anywhere}
.back{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;min-width:40px;min-height:40px;font:700 18px var(--f-body);cursor:pointer;flex:0 0 auto}
.daybadge{font-family:var(--f-mono);font-size:14px;color:var(--muted);white-space:nowrap}
.daybadge b{color:var(--fg);font-weight:500}
.progress{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent)}
.endzone{font-size:13px;color:var(--muted)}
nav.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;background:var(--sunk);padding:4px;border-radius:10px}
nav.tabs button{font:600 14px var(--f-body);border:0;background:transparent;color:var(--muted);padding:9px 1px;border-radius:7px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:370px){nav.tabs button{font-size:12.5px}}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
section.panel{display:grid;gap:16px;padding-top:8px}
h2{font-family:var(--f-display);font-weight:600;font-size:22px;margin:4px 0 0}
h3{font-family:var(--f-display);font-weight:600;font-size:19px;margin:0}
.note{font-size:14px;color:var(--muted);margin:0}
.banner{padding:10px 12px;border-radius:8px;font-size:14px;background:var(--warn-soft);color:var(--fg);border:1px solid var(--warn);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:14px;min-width:0}
.field{display:grid;gap:6px;min-width:0}
.field>label,.field>.lab,.lab{font-weight:600;font-size:15px}
.hint{font-size:13px;color:var(--muted);font-weight:400}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
input[type=text],input[type=date],input[type=time],input[type=number],textarea,select{width:100%;font:16px var(--f-body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 10px;min-height:46px}
.num{font-family:var(--f-mono)!important;font-size:18px!important}
textarea{min-height:76px;resize:vertical}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;min-height:44px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:8px 10px;font:600 15px var(--f-body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.seg button.alert[aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.primary{min-height:50px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:700 17px var(--f-body);cursor:pointer;padding:0 16px}
.primary:disabled{opacity:.5}
.ghost{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:8px;padding:10px 12px;font:600 15px var(--f-body);cursor:pointer;min-height:44px;text-align:center}
.danger{color:var(--bad);border-color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1 1 auto}
.status{font-size:14px;min-height:20px;color:var(--muted)}
.status.ok{color:var(--accent)} .status.err{color:var(--bad)}
.alertbox{border-radius:10px;padding:12px 14px;background:var(--bad-soft);border:1px solid var(--bad);display:grid;gap:4px;font-size:15px}
.list{display:grid;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:6px;text-align:left;font:inherit;color:inherit;width:100%}
button.item{cursor:pointer}
.item.empty{background:transparent;border-style:dashed;color:var(--muted)}
.hhead{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.hhead .d{font-weight:700}
.mono{font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--fg)}
.chip.al{background:var(--bad-soft);color:var(--bad)}
.chip.ok{background:var(--accent-soft)}
.rem{font-size:14px;color:var(--muted);overflow-wrap:anywhere;white-space:pre-line}
.who{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.dates{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.dates button{flex:0 0 auto;min-width:54px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:6px 4px;cursor:pointer;font:500 13px var(--f-mono);display:grid;gap:1px;justify-items:center}
.dates button small{font:600 11px var(--f-body);color:var(--muted);letter-spacing:.04em}
.dates button.done{border-color:var(--accent)}
.dates button.done small{color:var(--accent)}
.dates button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dates button[aria-pressed="true"] small{color:var(--accent-ink)}
.rel{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--sunk);border-radius:8px;padding:8px 10px;font:500 15px var(--f-mono);font-variant-numeric:tabular-nums}
.rel span{min-width:0}
.rel small{font-family:var(--f-body);color:var(--muted);font-size:12px;margin-left:6px}
.rel button{border:0;background:transparent;color:var(--muted);font:600 14px var(--f-body);padding:4px 8px;cursor:pointer}
.rel.none{background:transparent;border:1px dashed var(--line);font-family:var(--f-body);color:var(--muted)}
.others{border-top:1px dashed var(--line);padding-top:10px;display:grid;gap:6px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.photos:empty{display:none}
.photos button{padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;aspect-ratio:1;background:var(--sunk);cursor:pointer;max-width:100%}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.filebtn{display:inline-flex;align-items:center;justify-content:center}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
.viewer{position:fixed;inset:0;z-index:50;background:rgba(10,14,11,.94);display:grid;grid-template-rows:auto 1fr auto;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 12px)}
.viewer img{width:100%;height:100%;object-fit:contain;min-height:0}
.vbar{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#e8eee9;font-size:14px}
.vbtn{color:#e8eee9;border-color:#5b6a60}
.vbtn.danger{color:#f3a49c;border-color:#f3a49c}
.ctitle{font-family:var(--f-display);font-size:20px;font-weight:600;margin:0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
#chart{display:block;width:100%;height:auto;touch-action:pan-y}
#chart text{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
#chart .lbl{fill:var(--fg);font-size:11.5px}
#chart .zone{fill:var(--accent-soft);opacity:.7}
#chart .zonet{font-family:var(--f-body);font-size:11px;fill:var(--muted)}
#chart .grid{stroke:var(--line);stroke-width:1}
#chart .hit{fill:transparent;cursor:pointer}
.tip{font-size:14px;color:var(--muted);min-height:20px}
.tip b{color:var(--fg)}
.proto{display:grid;gap:10px}
.proto .pi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:8px}
dl.kv{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px}
dl.kv dt{color:var(--muted);font-size:13px;letter-spacing:.03em;text-transform:uppercase;padding-top:2px}
dl.kv dd{margin:0}
.al{color:var(--bad)}
ul.plain{margin:0;padding-left:20px;display:grid;gap:4px}
.sblock{display:grid;gap:6px}
.sblock h4{margin:0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.sblock p{margin:0;font-size:15px}
.steps{margin:0;padding-left:20px;display:grid;gap:6px;font-size:15px}
.chauffecard{display:grid;gap:8px}
.chauffecard .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
.lotsTable{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.lotsTable th,.lotsTable td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.lotsTable th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.scrollx{overflow-x:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:60;max-width:90vw;text-align:center}
.lotrow{display:grid;gap:8px;background:var(--sunk);border-radius:8px;padding:10px;border:1px solid transparent}
.lotrow.editing{border-color:var(--accent);background:var(--accent-soft)}
.lotrow .lt{font:500 15px var(--f-mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.lotact{display:flex;gap:6px;flex-wrap:wrap}
.lotact .ghost{min-height:40px;padding:6px 12px;flex:0 0 auto;background:var(--surface)}
.lotact .ghost:disabled{opacity:.35}
.install{border-color:var(--accent);background:var(--accent-soft)}
.install .hhead{flex-wrap:nowrap;align-items:flex-start}
.install .ghost{min-height:36px;padding:4px 10px;flex:0 0 auto}
.importbox{display:grid;gap:6px;padding:10px;border:1px dashed var(--line);border-radius:10px}
.xhead{display:flex;gap:8px;align-items:stretch}
.xhead .filebtn{flex:1 1 auto}
.helpbtn{flex:0 0 auto;width:46px;border-radius:50%;padding:0;font:700 20px var(--f-body);color:var(--accent);border-color:var(--accent);background:var(--surface)}
.helpbtn.on{background:var(--accent);color:var(--accent-ink)}
.xhelp{display:grid;gap:8px;background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:12px 14px;font-size:15px}
.xhelp ol,.xhelp ul{margin:0}
.xhelp .ghost{justify-self:start}
.xlist{display:grid;gap:4px;max-height:50vh;overflow:auto;padding-right:4px}
.xrow{display:flex;gap:10px;align-items:flex-start;padding:8px;border-radius:8px;background:var(--sunk);font:500 14px var(--f-mono);overflow-wrap:anywhere}
.xrow input{width:20px;height:20px;flex:0 0 auto;margin:0;accent-color:var(--accent)}
.two{align-items:end}
.num::placeholder{font-family:var(--f-body);font-size:16px}
input[type=time]{min-width:0;max-width:100%;display:block}
.syncbar{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 12px;font:600 13px var(--f-body);cursor:pointer;min-height:34px}
.syncbar i{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:0 0 auto}
.syncbar.ok i{background:var(--accent)} .syncbar.busy i{background:var(--warn);animation:pulse 1s infinite alternate}
.syncbar.wait i{background:var(--warn)} .syncbar.bad{color:var(--bad);border-color:var(--bad)} .syncbar.bad i{background:var(--bad)}
@keyframes pulse{from{opacity:1}to{opacity:.3}}
.photos button.nophoto{display:none}
.ex{font-size:13px;color:var(--muted);font-style:italic}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px}
/* ---- Chauffes Pro ---- */
.three{align-items:end}
.warnbox{background:var(--warn-soft);border-color:var(--warn)}
.warnbox .ghost{justify-self:start;background:var(--surface)}
.seuilsline{font-size:13.5px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:6px 10px}
.linkbtn{border:0;background:none;color:var(--accent);font:600 14px var(--f-body);text-decoration:underline;text-underline-offset:3px;padding:2px 0;cursor:pointer;justify-self:start;text-align:left}
.rel.out{background:var(--bad-soft);color:var(--bad)}
.rel.cap{font-family:var(--f-body);font-size:14px}
details.sensor>summary{list-style:none;cursor:pointer;display:grid;gap:2px}
details.sensor>summary::-webkit-details-marker{display:none}
details.sensor>summary h3::before{content:"▸ ";color:var(--accent)}
details.sensor[open]>summary h3::before{content:"▾ "}
details.sensor:not([open]){gap:0}
.filebtn.disabled{opacity:.45;pointer-events:none}
.check{display:flex;gap:10px;align-items:center;font-size:15px}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:0 0 auto;margin:0}
.sumbox{font-size:14px;background:var(--sunk);border-radius:8px;padding:10px 12px;line-height:1.5}
.sumbox:empty{display:none}
.bigrate{font:700 44px/1 var(--f-display);color:var(--accent)}
.bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;min-width:40px}
.bar span{display:block;height:100%;background:var(--accent);border-radius:4px}
.ratelist{display:grid;gap:6px}
.raterow{display:grid;grid-template-columns:minmax(60px,auto) 1fr 48px;gap:10px;align-items:center;font-size:14px}
.item>.raterow{grid-template-columns:1fr 48px}
.rv{text-align:right}
.item.editing{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.item .ghost{justify-self:start}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:baseline;flex:0 0 auto}
#k-sel button{flex:0 1 auto;display:inline-flex;align-items:center}
#k-sel button[aria-pressed="false"]{opacity:.55}
.lotsTable.cmp td,.lotsTable.cmp th{white-space:nowrap}
.lotsTable.cmp td .bar{margin-top:3px;height:5px}
.kchart{display:block;width:100%;height:auto;touch-action:pan-y}
.kchart text{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.kchart .grid{stroke:var(--line);stroke-width:1}
.kchart .hit{fill:transparent;cursor:pointer}
#chart .seuil{stroke:var(--bad);stroke-width:1.2;stroke-dasharray:5 4;opacity:.8}
#chart .seuilt{font-family:var(--f-body);font-size:10.5px;fill:var(--bad)}
.tilegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.homebtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.homebtns .ghost{min-height:50px;background:var(--surface)}
.chauffecard .rappel{font-size:13px;color:var(--warn);font-weight:600}
.langseg{max-width:320px}
.phrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:start;background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:15px}
.phrow .mono{font-size:13.5px}
.phrow .lotact{flex-direction:column}
.phform{display:grid;gap:12px;border-top:1px dashed var(--line);padding-top:12px}
.chip.ph{background:var(--warn-soft);color:var(--fg)}
#ph-open{justify-self:start}
.relgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;align-items:end}
.relgrid .colh{font-size:13px;color:var(--accent);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line);padding-bottom:3px}
section.panel>*{min-width:0}
#k-body{display:grid;gap:16px;min-width:0}
#k-body>*,.paper>*,.card>*{min-width:0}
.trial{gap:4px;border-style:dashed;border-color:var(--accent);background:var(--accent-soft)}
@media print{
  @page{margin:12mm}
  body{background:#fff!important;padding:0!important}
  .noprint,header.top,.toast,.viewer,body>.banner{display:none!important}
  .wrap{max-width:none;padding:0}
  section.panel{padding:0;display:block}
  .paper{border:0!important;padding:0!important;border-radius:0}
  .paper .scrollx{overflow:visible}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<body>
<div class="wrap" id="app"></div>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="Photo">
  <div class="vbar"><span id="vcap"></span><button type="button" class="ghost vbtn" id="vclose">Fermer</button></div>
  <img id="vimg" alt="">
  <div class="vbar" id="vdelbar"><button type="button" class="ghost vbtn danger" id="vdel">Supprimer la photo</button></div>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
'use strict';
/* ====================================================================
   Journal de chauffes — application hors ligne (PWA)
   Données : IndexedDB, sur l'appareil. Partage : fichiers .json fusionnés.
   Chaque note = une « entrée » avec id unique, auteur, majLe et
   éventuellement supprime:true (pour que les suppressions se partagent).
   ==================================================================== */
const APP_VERSION = '2.6.0';
const appVer = () => APP_VERSION+' '+((typeof S!=='undefined'&&S.lang==='es')?'(prueba)':'(essai)');
const APP_NAME = 'Chauffes Pro';
const EXPORT_FORMAT = 'chauffes-pro';
/* Projet séparé du Journal de chauffes : pas de synchronisation serveur (pour ne pas
   mélanger les essais avec les vraies notes de l'équipe). Passage de données par fichier. */
const SUPA_URL = '';
const SUPA_KEY = '';

/* ---------- Stockage IndexedDB ---------- */
const DB = (function(){
  let p=null;
  function open(){ if(p) return p; p=new Promise((ok,ko)=>{ const r=indexedDB.open('chauffes-pro',1);
    r.onupgradeneeded=()=>{ const d=r.result; d.createObjectStore('chauffes',{keyPath:'id'}); d.createObjectStore('entrees',{keyPath:'id'}); d.createObjectStore('photos'); d.createObjectStore('reglages'); };
    r.onsuccess=()=>ok(r.result); r.onerror=()=>ko(r.error); }); return p; }
  function run(store, mode, fn){ return open().then(d=>new Promise((ok,ko)=>{ const t=d.transaction(store,mode); const s=t.objectStore(store); let res; const r=fn(s); if(r) r.onsuccess=()=>{ res=r.result; }; t.oncomplete=()=>ok(res); t.onerror=()=>ko(t.error); t.onabort=()=>ko(t.error); })); }
  return {
    all:store=>run(store,'readonly',s=>s.getAll()),
    get:(store,key)=>run(store,'readonly',s=>s.get(key)),
    put:(store,val,key)=>run(store,'readwrite',s=>key===undefined?s.put(val):s.put(val,key)),
    del:(store,key)=>run(store,'readwrite',s=>s.delete(key)),
    putMany:(store,vals)=>open().then(d=>new Promise((ok,ko)=>{ const t=d.transaction(store,'readwrite'); const s=t.objectStore(store); vals.forEach(v=>s.put(v)); t.oncomplete=()=>ok(); t.onerror=()=>ko(t.error); }))
  };
})();

const L = (fr, es) => S.lang==='es' ? es : fr;
const plural = (n, frS, frP, esS, esP) => fmtN(n)+' '+(S.lang==='es' ? (n===1?esS:esP) : (n>1?frP:frS));

/* ---------- Seuils de température (Chauffes Pro) ---------- */
const seuilsOf = ch => Object.assign({inMin:null, inMax:null, saut:null, rappel:null, montee:null, hInMin:null, hInMax:null, hExtMin:null, o2Min:null}, ch.seuils||{});
/* Montée en température : jusqu'à ce jour inclus, pas d'alerte de température (min, max, variation). */
const enMontee = (ch, jour) => { const m=seuilsOf(ch).montee; return m!=null && jour<=m; };
const hasSeuils = ch => { const s=seuilsOf(ch); return s.inMin!=null || s.inMax!=null || s.saut!=null || s.hInMin!=null || s.hInMax!=null || s.hExtMin!=null || s.o2Min!=null; };
const hourOf = r => { if(r.heure && /^\d{1,2}:\d{2}$/.test(r.heure)){ const [h,m]=r.heure.split(':').map(Number); return h+m/60; } return 12; };
function relDate(ch, r){ const d=dayDate(ch, r.jour); if(!d) return null; const h=hourOf(r); d.setHours(Math.floor(h), Math.round((h%1)*60), 0, 0); return d; }
/* Humidité relative : dans la pièce (hors palox) et dans le palox. Ancien champ « hum » = palox, sauf capteur placé hors palox. */
const hIn = r => r.humInt!=null ? r.humInt : (r.hum!=null && r.pos!=='ext' ? r.hum : null);
const hOut = r => r.humExt!=null ? r.humExt : (r.hum!=null && r.pos==='ext' ? r.hum : null);
function humText(r){ const a=[]; if(hOut(r)!=null) a.push(L('HR pièce ','HR sala ')+fmtN(hOut(r))+' %'); if(hIn(r)!=null) a.push(L('HR palox ','HR palox ')+fmtN(hIn(r))+' %'); if(r.o2Ext!=null) a.push(L('O₂ pièce ','O₂ sala ')+fmtN(r.o2Ext)+' %'); if(r.o2Int!=null) a.push('O₂ palox '+fmtN(r.o2Int)+' %'); return a.join(' · '); }
const rngTxt=(a,unit)=>{ a=a.filter(v=>v!=null); if(!a.length) return null; const r1=v=>fmtN(Math.round(v*10)/10); const mn=Math.min(...a), mx=Math.max(...a); return (mn===mx?r1(mn):r1(mn)+'–'+r1(mx))+unit; };
/* Humidité hors seuils : 'hlow' / 'hhigh' (palox), 'rlow' (pièce). */
function humOut(ch, r){ const s=seuilsOf(ch), o=[]; const hi=hIn(r), he=hOut(r);
  if(hi!=null){ if(s.hInMin!=null && hi<s.hInMin) o.push('hlow'); if(s.hInMax!=null && hi>s.hInMax) o.push('hhigh'); }
  if(he!=null && s.hExtMin!=null && he<s.hExtMin) o.push('rlow');
  if(s.o2Min!=null && [r.o2Int,r.o2Ext].some(v=>v!=null && v<s.o2Min)) o.push('o2low'); return o; }
function relOut(ch, r){ const s=seuilsOf(ch); if(r.tInt==null || enMontee(ch,r.jour)) return ''; if(s.inMin!=null && r.tInt<s.inMin) return 'cold'; if(s.inMax!=null && r.tInt>s.inMax) return 'hot'; return ''; }
/* Statistiques jour par jour + alertes de température (trop froid, trop chaud, variation brusque de la moyenne d'un jour à l'autre). */
function dayStats(ch){
  const s=seuilsOf(ch); const days=[];
  for(let j=1;j<=ch.duree;j++) days.push({j, n:0, nCap:0, ins:[], exts:[], humsIn:[], humsExt:[], cold:0, hot:0, hlow:0, hhigh:0, rlow:0, o2low:0, o2s:[]});
  releves(ch.id).forEach(r=>{ const d=days[r.jour-1]; if(!d) return; d.n++; if(r.source==='capteur') d.nCap++;
    if(r.tInt!=null){ d.ins.push(r.tInt); const o=relOut(ch,r); if(o==='cold') d.cold++; if(o==='hot') d.hot++; }
    if(r.tExt!=null) d.exts.push(r.tExt); if(hIn(r)!=null) d.humsIn.push(hIn(r)); if(hOut(r)!=null) d.humsExt.push(hOut(r)); humOut(ch,r).forEach(k=>d[k]++); [r.o2Int,r.o2Ext].forEach(v=>{ if(v!=null) d.o2s.push(v); }); });
  const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null, mn=a=>a.length?Math.min(...a):null, mx=a=>a.length?Math.max(...a):null;
  let prev=null;
  days.forEach(d=>{ d.inMean=mean(d.ins); d.inMin=mn(d.ins); d.inMax=mx(d.ins); d.extMean=mean(d.exts); d.extMin=mn(d.exts); d.extMax=mx(d.exts); d.humInMin=mn(d.humsIn); d.humInMax=mx(d.humsIn); d.humExtMin=mn(d.humsExt); d.humExtMax=mx(d.humsExt); d.saut=null;
    if(d.inMean!=null){ if(prev && s.saut!=null && d.j-prev.j===1 && !enMontee(ch,d.j) && Math.abs(d.inMean-prev.inMean)>=s.saut) d.saut=d.inMean-prev.inMean; prev=d; }
    d.o2Min=d.o2s.length?Math.min(...d.o2s):null; d.hum=!!(d.hlow||d.hhigh||d.rlow||d.o2low); d.alert=!!(d.cold||d.hot||d.saut!=null||d.hum); });
  return days;
}
function dayTempAlerts(ch, d){

/* Rappel : nombre d'heures depuis le dernier relevé, si la chauffe est en cours. */
function releveAge(ch){
  if(!ch.debut || ch.archive) return null; const start=dayDate(ch,1); start.setHours(0,0,0,0); const end=dayDate(ch,ch.duree); end.setHours(23,59,0,0);
  const now=new Date(); if(now<start || now>end) return null;
  let last=null; releves(ch.id).forEach(r=>{ const d=relDate(ch,r); if(d && (!last||d>last)) last=d; });
  return last ? (now-last)/3600000 : (now-start)/3600000;
}

const CAUSES=['Pas de cal',"Cal d'un seul côté",'Moisissure','Bois sec','Pas de racines','Autre'];
const bilansOf = cid => entriesOf(cid,'bilan');

/* Un bilan se saisit soit en comptant (plants triés / plants bons), soit directement en pourcentage. */
const isPctBilan = b => !!b && b.pct!=null && !(b.tries>0);
const bilanRate = b => !b ? null : (b.tries>0 && b.bons!=null ? Math.max(0,Math.min(1,b.bons/b.tries)) : (b.pct!=null ? Math.max(0,Math.min(1,b.pct/100)) : null));

/* Réussite moyenne pondérée : par le nombre de plants du lot s'il est connu, sinon par le nombre de plants triés. */
function aggRate(items){ let w=0, g=0, tries=0, bons=0, plants=0;
  items.forEach(({b, qte})=>{ const r=bilanRate(b); if(r==null) return; const wt=qte>0?qte:(b.tries>0?b.tries:100); w+=wt; g+=r*wt; if(b.tries>0){ tries+=b.tries; bons+=b.bons||0; } if(qte>0) plants+=qte; });
  return {rate:w?g/w:null, tries, bons, plants}; }
function lotsWithBilan(ch){
  const lots=(ch.lots||[]).map(l=>({lot:String(l.lot), variete:l.variete||'', pg:l.pg||'', qte:l.qte||null}));
  bilansOf(ch.id).forEach(b=>{ if(!lots.some(l=>l.lot===String(b.lot))) lots.push({lot:String(b.lot), variete:b.variete||'', pg:b.pg||'', qte:null}); });
  return lots.map(l=>Object.assign(l,{b:bilanOf(ch.id,l.lot)}));
}
function chauffeRate(ch){ return aggRate(lotsWithBilan(ch)); }

async function unzipEntries(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf); let eocd=-1;
  for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-66000);i--){ if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; } }
  if(eocd<0) throw new Error('notzip');
  const n=dv.getUint16(eocd+10,true); let p=dv.getUint32(eocd+16,true); const out={}; const td=new TextDecoder();
  for(let k=0;k<n;k++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true), nl=dv.getUint16(p+28,true), el=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), lho=dv.getUint32(p+42,true);
    const name=td.decode(u8.subarray(p+46,p+46+nl)); p+=46+nl+el+cl;
    out[name]={method,csize,lho};
  }
  out.__read=async name=>{ const e=out[name]; if(!e) return null;
    const ln=dv.getUint16(e.lho+26,true), le=dv.getUint16(e.lho+28,true); const data=u8.subarray(e.lho+30+ln+le, e.lho+30+ln+le+e.csize);
    if(e.method===0) return td.decode(data);
    if(e.method!==8) throw new Error('method');
    const ds=new DecompressionStream('deflate-raw'); const stream=new Blob([data]).stream().pipeThrough(ds); return await new Response(stream).text(); };
  return out;
}
const xmlDoc = t => new DOMParser().parseFromString(t,'application/xml');
const byTag = (node,tag) => Array.from(node.getElementsByTagNameNS('*',tag));
function colIndex(ref){ const m=/^([A-Z]+)/.exec(ref||''); if(!m) return -1; let n=0; for(const ch of m[1]) n=n*26+(ch.charCodeAt(0)-64); return n-1; }
async function readXlsx(buf){
  const z=await unzipEntries(buf);
  const shared=[]; const sst=await z.__read('xl/sharedStrings.xml');
  if(sst) byTag(xmlDoc(sst),'si').forEach(si=>shared.push(byTag(si,'t').map(t=>t.textContent).join('')));
  const wb=xmlDoc(await z.__read('xl/workbook.xml')); const rels=xmlDoc(await z.__read('xl/_rels/workbook.xml.rels')||'<x/>');
  const relMap={}; byTag(rels,'Relationship').forEach(r=>relMap[r.getAttribute('Id')]=r.getAttribute('Target'));
  const sheets=[];
  for(const sh of byTag(wb,'sheet')){
    const rid=sh.getAttribute('r:id')||sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
    let target=relMap[rid]||''; target=target.replace(/^\//,''); if(!target.startsWith('xl/')) target='xl/'+target;
    sheets.push({name:sh.getAttribute('name'), path:target, state:sh.getAttribute('state')});
  }
  return { sheets: sheets.filter(s=>s.state!=='hidden'&&s.state!=='veryHidden'), readSheet: async sh=>{
    const x=await z.__read(sh.path); if(!x) return [];
    const rows=[];
    byTag(xmlDoc(x),'row').forEach(r=>{ const ri=Number(r.getAttribute('r'))-1; const row=[];
      byTag(r,'c').forEach((c,ci)=>{ const ref=c.getAttribute('r'); const ix=ref?colIndex(ref):ci; const t=c.getAttribute('t'); const v=byTag(c,'v')[0]; let val=null;
        if(t==='s'&&v) val=shared[Number(v.textContent)]; else if(t==='inlineStr') val=byTag(c,'t').map(e=>e.textContent).join(''); else if(t==='b'&&v) val=v.textContent==='1'; else if(v){ const tx=v.textContent; val=(t==='str'||t==='e')?tx:(tx!==''&&isFinite(Number(tx))?Number(tx):tx); }
        if(ix>=0) row[ix]=val; });
      rows[ri>=0?ri:rows.length]=row; });
    return Array.from(rows,r=>r||[]);
  }};
}
function parseCsv(text){
  const first=text.split(/\r?\n/,1)[0]; const sep=(first.split(';').length>first.split(',').length)?';':(first.includes('\t')?'\t':',');
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=ch; }
    else if(ch==='"') q=true; else if(ch===sep){ row.push(cur); cur=''; } else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(cur); rows.push(row); row=[]; cur=''; } else cur+=ch; }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }

}
const normH = v => String(v==null?'':v).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');

const COLS = {
  lot:['lote','lot','lots','lotes','nlot','nolot','nlote','numlot','numerolot','numerodelot','lotno','lotnumber'],
  variete:['variedad','variete','varietes','cepage','cepages','var','variety','cultivar','vari'],
  pg:['pi','portegreffe','portegreffes','pg','portainjerto','patron','rootstock'],
  qteLot:['qtelote','qtelot','qteparlot','quantitelot','quantiteparlot','totallot','cantidadlote','qtelots','plantslot'],
  qte:['qte','quantite','qtediaria','cantidad','plants','nbplants','nombredeplants','quantiteplants','qteplants','quantiteplant'],
  palox:['npaloxtotal','paloxtotal','palox','nbpalox','npalox','nombredepalox','bins','nbins','numeropalox']
};
function detectLots(rows){
  let best=null;
  for(let r=0;r<Math.min(rows.length,25);r++){
    const map={}; (rows[r]||[]).forEach((h,ci)=>{ const n=normH(h); if(!n) return; for(const [k,list] of Object.entries(COLS)) if(map[k]===undefined && list.includes(n)) map[k]=ci; });
    const score=Object.keys(map).length;
    if(map.lot!==undefined && (!best||score>best.score)) best={row:r,map,score};
  }
  if(!best) return null;
  const M=best.map, lots=[], byLot={};
  for(let r=best.row+1;r<rows.length;r++){
    const row=rows[r]||[]; let lot=row[M.lot]; if(lot==null||lot==='') continue;
    lot=typeof lot==='number'?String(Math.round(lot*100)/100):String(lot).trim();
    if(!/\d/.test(lot) || /total/i.test(lot) || lot.length>15) continue;
    let L=byLot[lot]; if(!L){ L=byLot[lot]={lot, variete:'', pg:'', qteLot:null, qteSum:0, qteN:0, palox:null, rows:0}; lots.push(L); }
    L.rows++;
    const g=k=>M[k]!==undefined?row[M[k]]:null;
    if(!L.variete && g('variete')!=null && String(g('variete')).trim()) L.variete=String(g('variete')).trim();
    if(!L.pg && g('pg')!=null && String(g('pg')).trim()) L.pg=String(g('pg')).trim();
    const ql=strictNum(g('qteLot')); if(ql!=null&&ql>0) L.qteLot=ql;
    const qd=strictNum(g('qte')); if(qd!=null){ L.qteSum+=qd; L.qteN++; }
    const px=strictNum(g('palox')); if(px!=null&&px>0) L.palox=px;
  }
  return { header:best.row+1, map:M, headers:rows[best.row], lots:lots.map(L=>({lot:L.lot, variete:L.variete, pg:L.pg, qte:L.qteLot!=null?L.qteLot:(L.qteN?L.qteSum:null), palox:L.palox, rows:L.rows})) };
}


/* ====================================================================
   SYNCHRONISATION AUTOMATIQUE (Supabase) — optionnelle
   Chaque appareil garde tout en local ; dès qu'il y a du réseau, il envoie
   ses changements et reçoit ceux de l'équipe. La version la plus récente
   (majLe) gagne. Les photos restent sur l'appareil qui les a prises.
   ==================================================================== */
const Sync = {
  code:null, pending:new Set(), since:null, lastOk:null, state:'off', err:'', running:false, again:false, timer:null, received:0,
  async load(){
    this.code=(await DB.get('reglages','equipe'))||null;
    this.pending=new Set((await DB.get('reglages','syncPending'))||[]);
    this.since=(await DB.get('reglages','syncSince'))||null;
    this.lastOk=(await DB.get('reglages','syncLastOk'))||null;
    this.state=this.active()?'idle':'off';
  },
  active(){ return SYNC_AVAILABLE && !!this.code; },
  savePending(){ clearTimeout(this._ps); this._ps=setTimeout(()=>DB.put('reglages',Array.from(this.pending),'syncPending').catch(()=>{}),300); },
  mark(kind,id){ if(!this.active()) return; if(kind==='entree'){ const e=S.entrees.find(x=>x.id===id); if(e&&e.type==='photo') return; } this.pending.add(kind+'|'+id); this.savePending(); this.schedule(2500); },
  markAll(){ S.chauffes.forEach(c=>this.pending.add('chauffe|'+c.id)); S.entrees.forEach(e=>{ if(e.type!=='photo') this.pending.add('entree|'+e.id); }); this.savePending(); },
  async setCode(code){
    code=(code||'').trim(); const changed=code!==(this.code||'');
    this.code=code||null; await DB.put('reglages',this.code,'equipe');
    if(changed){ this.since=null; await DB.put('reglages',null,'syncSince'); this.lastOk=null; await DB.put('reglages',null,'syncLastOk'); this.pending=new Set(); if(this.code) this.markAll(); else this.savePending(); }
    this.state=this.active()?'idle':'off'; this.err=''; this.paint();
    if(this.active()) this.run();
  },
  schedule(ms){ if(!this.active()) return; clearTimeout(this.timer); this.timer=setTimeout(()=>this.run(),ms); },
  async rpc(fn, body){
    const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),20000);
    const headers={'Content-Type':'application/json','apikey':SUPA_KEY}; if(/^eyJ/.test(SUPA_KEY)) headers['Authorization']='Bearer '+SUPA_KEY;
    let r; try{ r=await fetch(SUPA_URL.replace(/\/$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers,body:JSON.stringify(body),signal:ctl.signal,cache:'no-store'}); }
    catch(e){ const er=new Error('offline'); er.kind='offline'; throw er; } finally{ clearTimeout(t); }
    const txt=await r.text(); let j=null; try{ j=txt?JSON.parse(txt):null; }catch(e){}
    if(!r.ok){ const msg=(j&&(j.message||j.hint||j.details))||txt||('HTTP '+r.status); const er=new Error(msg); er.kind=/code_equipe_incorrect/.test(msg)?'badcode':'server'; throw er; }
    return j;
  },
  async push(){
    const keys=Array.from(this.pending);
    for(let i=0;i<keys.length;i+=200){
      const chunk=keys.slice(i,i+200); const rows=[];
      chunk.forEach(k=>{ const [kind,id]=[k.slice(0,k.indexOf('|')),k.slice(k.indexOf('|')+1)]; const rec=kind==='chauffe'?S.chauffes.find(x=>x.id===id):S.entrees.find(x=>x.id===id); if(rec) rows.push({kind,id,maj_le:rec.majLe||'',data:rec}); });
      if(rows.length) await this.rpc('jc_push',{p_code:this.code,p_rows:rows});
      chunk.forEach(k=>this.pending.delete(k)); this.savePending();
    }
  },
  async pull(){
    let since=this.since, got=0, guard=0;
    while(guard++<50){
      const rows=await this.rpc('jc_pull',{p_code:this.code,p_since:since,p_limit:1000})||[];
      const ch=[], en=[];
      for(const r of rows){
        const d=r.data; if(!d||typeof d!=='object') continue; d.majLe=d.majLe||r.maj_le;
        if(r.kind==='chauffe'){ const ex=S.chauffes.find(x=>x.id===r.id); if(!ex||(r.maj_le||'')>(ex.majLe||'')){ if(this.pending.has('chauffe|'+r.id)&&ex&&(ex.majLe||'')>=(r.maj_le||'')) continue; ch.push(d); } }
        else if(r.kind==='entree'){ const ex=S.entrees.find(x=>x.id===r.id); if(!ex||(r.maj_le||'')>(ex.majLe||'')) en.push(d); }
      }
      if(ch.length){ await DB.putMany('chauffes',ch); ch.forEach(c=>{ const i=S.chauffes.findIndex(x=>x.id===c.id); if(i>=0) S.chauffes[i]=c; else S.chauffes.push(c); }); }
      if(en.length){ await DB.putMany('entrees',en); en.forEach(e=>{ const i=S.entrees.findIndex(x=>x.id===e.id); if(i>=0) S.entrees[i]=e; else S.entrees.push(e); }); }
      got+=ch.length+en.length;
      if(!rows.length) break;
      const last=rows[rows.length-1].updated_at;
      if(rows.length>=1000){ since=new Date(Date.parse(last)-1).toISOString(); continue; }
      const overlap=new Date(Date.parse(last)-120000).toISOString();
      if(!this.since || overlap>this.since){ this.since=overlap; await DB.put('reglages',this.since,'syncSince'); }
      break;
    }
    return got;
  },
  async run(){
    if(!this.active()) return; if(this.running){ this.again=true; return; }
    if(this.state==='badcode') return;
    this.running=true; this.state='busy'; this.paint();
    try{
      await this.push();
      const got=await this.pull();
      this.lastOk=nowIso(); await DB.put('reglages',this.lastOk,'syncLastOk'); this.state='idle'; this.err='';
      if(got){ this.received+=got; refreshAfterSync(got); }
    }catch(e){ this.state=e.kind==='offline'?'offline':(e.kind==='badcode'?'badcode':'error'); this.err=e.message||''; }
    finally{ this.running=false; this.paint(); if(this.again){ this.again=false; this.schedule(500); } }
  },
  ago(){ if(!this.lastOk) return ''; const m=Math.round((Date.now()-Date.parse(this.lastOk))/60000); return m<1?'à l\'instant':m<60?'il y a '+m+' min':m<1440?'il y a '+Math.round(m/60)+' h':'il y a '+Math.round(m/1440)+' j'; },
  label(){
    const n=this.pending.size, w=n?` · ${n} note${n>1?'s':''} en attente d'envoi`:'';
    if(!SYNC_AVAILABLE) return null;
    if(!this.code) return {cls:'off', txt:'Partage automatique désactivé (code d\'équipe dans Réglages)'};
    if(this.state==='busy') return {cls:'busy', txt:'Synchronisation…'};
    if(this.state==='badcode') return {cls:'bad', txt:'Code d\'équipe incorrect : vérifie-le dans Réglages'};
    if(this.state==='offline') return {cls:'wait', txt:'Pas de réseau : envoi automatique au retour du réseau'+w};
    if(this.state==='error') return {cls:'wait', txt:'Serveur indisponible, nouvel essai bientôt'+w};
    return {cls:'ok', txt:(this.lastOk?'À jour avec l\'équipe · '+this.ago():'Partage automatique activé')+w};
  },
  paint(){ document.querySelectorAll('[data-syncbar]').forEach(el=>{ const l=this.label(); el.hidden=!l; if(l){ el.className='syncbar '+l.cls; el.querySelector('span').textContent=l.txt; } }); }
};
function syncbarHTML(){ return SYNC_AVAILABLE?'<button type="button" class="syncbar" data-syncbar><i aria-hidden="true"></i><span></span></button>':''; }
function bindSyncbar(){ document.querySelectorAll('[data-syncbar]').forEach(b=>b.onclick=()=>{ if(Sync.state==='badcode'||!Sync.code) go('settings'); else { Sync.state=Sync.state==='badcode'?'idle':Sync.state; Sync.run(); } }); Sync.paint(); }
function refreshAfterSync(n){

let installPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installPrompt=e; if(S.view==='home'||!S.me) render(); });
window.addEventListener('appinstalled',()=>{ installPrompt=null; toast('Application installée.'); render(); });
function envInfo(){
  const ua=navigator.userAgent||''; const ios=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const android=/Android/i.test(ua); const standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
  const inApp=/FBAN|FBAV|Instagram|Line\/|WhatsApp|; wv\)|GSA\//i.test(ua);
  const iosOther=ios&&/CriOS|FxiOS|EdgiOS|OPiOS/.test(ua);
  const coarse=window.matchMedia&&matchMedia('(pointer:coarse)').matches;
  const desktopMode=coarse && window.innerWidth>=800 && Math.min(screen.width,screen.height)<600;
  return {ios,android,standalone,inApp,iosOther,desktopMode};
}
function installHTML(){
  const E=envInfo(); let out='';
  if(E.desktopMode) out+=`<div class="banner"><span><b>Affichage trop petit ?</b> Le navigateur est en mode « ordinateur ». Menu ⋮ en haut à droite → décoche <b>« Version pour ordinateur »</b> (ou « Site pour ordinateur »).</span></div>`;
  if(E.standalone) return out;
  let dismissed=false; try{ dismissed=localStorage.getItem(LS+'installHidden')==='1'; }catch(e){}
  if(dismissed && !E.desktopMode) return out;
  let how='';
  if(E.inApp) how= E.ios ? 'Ce lien est ouvert dans une autre app (WhatsApp, Instagram…). Touche <b>⋯ ou la boussole</b> pour l\'ouvrir dans <b>Safari</b>, puis installe-la depuis Safari.' : 'Ce lien est ouvert dans une autre app (WhatsApp…). Touche le menu <b>⋮</b> → <b>« Ouvrir dans Chrome »</b>, puis installe-la depuis Chrome.';
  else if(E.iosOther) how='Sur iPhone et iPad, l\'installation se fait depuis <b>Safari</b> : copie l\'adresse et ouvre-la dans Safari.';
  else if(E.ios) how='Touche <b>Partager</b> (carré avec une flèche ⬆︎) puis <b>« Sur l\'écran d\'accueil »</b> → Ajouter. Ensuite, ouvre toujours l\'app par son icône.';
  else if(E.android) how= installPrompt ? 'Un seul toucher suffit :' : 'Menu <b>⋮</b> en haut à droite de Chrome → <b>« Installer l\'application »</b> ou <b>« Ajouter à l\'écran d\'accueil »</b>. Ensuite, ouvre toujours l\'app par son icône.';
  else how= installPrompt ? 'Tu peux l\'installer sur cet appareil :' : 'Ouvre cette adresse sur ton téléphone pour l\'installer.';
  out+=`<div class="card install"><div class="hhead"><h3>Installer l'app sur ce téléphone</h3><button class="ghost" type="button" id="inst-x" aria-label="Masquer">✕</button></div><p class="note" style="color:var(--fg)">${how}</p>${installPrompt&&!E.inApp?'<button class="primary" type="button" id="inst-go">Installer l\'app</button>':''}<p class="note">Une fois installée, elle fonctionne sans internet.</p></div>`;
  return out;
}
function bindInstall(){
  const x=$('inst-x'); if(x) x.onclick=()=>{ try{ localStorage.setItem(LS+'installHidden','1'); }catch(e){} render(); };
  const g=$('inst-go'); if(g) g.onclick=async()=>{ if(!installPrompt) return; installPrompt.prompt(); try{ await installPrompt.userChoice; }catch(e){} installPrompt=null; render(); };

/* Modèles avec des nombres ou des noms (appliqués au texte entier). */
const ES_RE = [
  [/^(.+?) : (.+)$/, m=>{ const a=ES[m[1]], b=ES[m[2]]||(/^[\d\s,.–°C%]+$/.test(m[2])?m[2]:null); return a&&b?a+': '+b:null; }],

  [/^Début (\d\d\/\d\d)$/, m=>'Inicio '+m[1]],
  [/^(?:Début le (.+) · )?fin de chauffe prévue entre J(\d+) et J(\d+)$/, m=>(m[1]?'Inicio el '+m[1]+' · ':'')+'fin de calefacción prevista entre J'+m[2]+' y J'+m[3]],
  [/^(\d+) jours · fin prévue J(\d+)–J(\d+)$/, m=>m[1]+' días · fin prevista J'+m[2]+'–J'+m[3]],

  [/^(⚠ )?(.+?) · ext\. (.+?) · dedans (.+)$/, m=>(m[1]||'')+(m[2]==='heure ?'?'hora ?':m[2])+' · ext. '+m[3]+' · dentro '+m[4]],
  [/^(ext\. .+|dedans .+|[\d,–]+ %.*)$/, m=>m[1].replace(/\bdedans\b/g,'dentro').replace(/\((\d+) relevés?\)/,(x,n)=>'('+n+(n==='1'?' lectura)':' lecturas)'))],
  [/^· (.+)$/, m=>'· '+m[1].replace('dans les palox','en los palox').replace('extérieur des palox','exterior de los palox').replace(/ à (\d)/,' a las $1').replace('capteur','sensor').replace('hors seuil','fuera de umbral')],

  [/^Colonnes lues \(ligne (\d+)\) : (.+)\. Décoche les lots qui ne font pas partie de cette chauffe\.$/, m=>'Columnas leídas (fila '+m[1]+'): '+m[2].replace(/\bVariété\b/,'Variedad').replace(/\bPorte-greffe\b/,'Portainjerto').replace('Plants par lot','Plantas por lote').replace(/\bPlants\b/,'Plantas').replace(/\bLot\b/,'Lote').replace(/colonne /g,'columna ')+'. Desmarca los lotes que no forman parte de esta calefacción.'],

const I18N = {
  ATTRS:['placeholder','aria-label','title'],
  tr(t){ const k=t.replace(/\s+/g,' ').trim(); if(!k) return null; if(Object.prototype.hasOwnProperty.call(ES,k)) return ES[k];
    for(const [re,f] of ES_RE){ const m=re.exec(k); if(m){ const r=f(m); if(r!=null && r!==k) return r; } } return null; },
  skip(el){ return !el || !!el.closest('textarea,.rem,.who,[data-notr],script,style,dd.notr'); },
  text(n){ if(this.skip(n.parentElement)) return; const raw=n.nodeValue; const r=this.tr(raw); if(r!=null){ const lead=raw.match(/^\s*/)[0], tail=raw.match(/\s*$/)[0]; const nv=(r.startsWith(' ')?'':lead)+r+tail; if(nv!==raw) n.nodeValue=nv; } },
  attrs(el){ if(el.closest('[data-notr]')) return; for(const a of this.ATTRS){ const v=el.getAttribute(a); if(v){ const r=this.tr(v); if(r!=null && r!==v) el.setAttribute(a,r); } } },
  walk(root){
    if(root.nodeType===3) return this.text(root);
    if(root.nodeType!==1) return;
    if(root.hasAttribute && this.ATTRS.some(a=>root.hasAttribute(a))) this.attrs(root);
    root.querySelectorAll && root.querySelectorAll('[placeholder],[aria-label],[title]').forEach(e=>this.attrs(e));
    if(this.skip(root)) return;
    const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT); let n; const list=[]; while((n=w.nextNode())) list.push(n); list.forEach(x=>this.text(x));
  },
  start(){
    const obs=new MutationObserver(ms=>{ if(S.lang!=='es') return; for(const m of ms){ if(m.type==='childList') m.addedNodes.forEach(n=>this.walk(n)); else if(m.type==='characterData') this.text(m.target); else if(m.type==='attributes') this.attrs(m.target); } });
    obs.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:this.ATTRS});
    if(S.lang==='es') this.walk(document.body);
  }
};

/* ---------- Choix de la langue ---------- */
function langSegHTML(id){ return `<div class="seg langseg" id="${id}" role="group" aria-label="Langue / Idioma"><button type="button" data-v="fr" aria-pressed="${S.lang==='fr'}">Français</button><button type="button" data-v="es" aria-pressed="${S.lang==='es'}">Español</button></div>`; }
function bindLangSeg(id){ const el=$(id); if(!el) return; el.querySelectorAll('button').forEach(b=>b.onclick=async()=>{ if(S.lang===b.dataset.v) return; const wn=$('w-nom'); try{ if(wn) sessionStorage.setItem(LS+'wnom',wn.value); sessionStorage.setItem(LS+'view',S.view); }catch(e){} S.lang=b.dataset.v; try{ localStorage.setItem(LS+'lang',S.lang); }catch(e){} try{ await DB.put('reglages',S.lang,'lang'); }catch(e){} location.reload(); }); }

const app=$('app');
function render(){
  if(!S.me) return renderWelcome();
  if(S.view==='new' || S.view==='edit') return renderChauffeForm();
  if(S.view==='settings') return renderSettings();
  if(S.view==='compare') return renderCompare();
  if(S.view==='registre' && curChauffe()) return renderRegistre();
  if(S.view==='chauffe' && curChauffe()) return renderChauffe();
  S.view='home'; renderHome();
}
function go(view, extra){ Object.assign(S,{view},extra||{}); render(); window.scrollTo({top:0}); }

      <div class="meta">${ch.debut?'<span>Début '+esc(dayShort(ch,1))+'</span>':''}<span>${(ch.lots||[]).length} lots</span><span>${nb} note${nb>1?'s':''}</span>${al?'<span class="al">'+al+' alerte'+(al>1?'s':'')+'</span>':''}${chauffeRate(ch).rate!=null?'<span>'+esc(L('réussite ','éxito ')+pct(chauffeRate(ch).rate))+'</span>':''}${ch.archive?'<span>Archivée</span>':''}</div>${rappelDue(ch)!=null?`<div class="rappel">⏱ ${esc(L('Pas de relevé depuis ','Sin lectura desde hace ')+fmtAge(rappelDue(ch)))}</div>`:''}`;
    b.onclick=()=>{ const ln=lastDay(ch); go('chauffe',{chauffeId:ch.id, tab:'jour', jour:Math.max(1,ln||1)}); };
    el.appendChild(b);
  });
  bindInstall(); bindSyncbar();
  $('h-new').onclick=()=>go('new');
  $('h-cmp').onclick=()=>go('compare');
  $('h-set').onclick=()=>go('settings');
  if(seedAvail){ $('seed-me').onclick=()=>importSeed(true); $('seed-ok').onclick=()=>importSeed(false); $('seed-no').onclick=async()=>{ S.seedHidden=true; await DB.put('reglages',true,'seedHidden'); render(); }; }
  $('h-share').onclick=()=>exportAll($('h-st'));
  $('h-imp').onchange=e=>importFile(e,$('h-st'));
}

const SEED_AUTHOR={id:'auteur-raphael-vivero', nom:'Raphaël'};
async function importSeed(isMe){
  const sd=SEED_CHAUFFE1;
  if(isMe && S.me.id!==SEED_AUTHOR.id){
    const old=S.me.id; S.me=Object.assign({},S.me,{id:SEED_AUTHOR.id}); await DB.put('reglages',S.me,'me');
    const mine=S.entrees.filter(e=>e.auteurId===old).map(e=>Object.assign({},e,{auteurId:S.me.id}));
    if(mine.length){ await DB.putMany('entrees',mine); mine.forEach(e=>{ const i=S.entrees.findIndex(x=>x.id===e.id); S.entrees[i]=e; }); }
  }
  const c=JSON.parse(JSON.stringify(sd.chauffe)); c.creeLe=c.creeLe||nowIso();
  await saveChauffe(c);
  const list=sd.entrees.map(e=>Object.assign({},e,{auteurId:SEED_AUTHOR.id, auteurNom:isMe?S.me.nom:SEED_AUTHOR.nom, majLe:e.creeLe||'2026-10-06T00:00:00.000Z'}));
  await DB.putMany('entrees',list); list.forEach(e=>{ const i=S.entrees.findIndex(x=>x.id===e.id); if(i>=0) S.entrees[i]=e; else S.entrees.push(e); Sync.mark('entree',e.id); });
  toast('Chauffe 1 ajoutée.'); render();
}

        <span class="ex">${esc(L("Trop sec : le bois et le cal sèchent. Trop humide : risque de moisissure. Les seuils d'humidité s'appliquent dès J1.","Demasiado seco: la madera y el callo se secan. Demasiado húmedo: riesgo de hongos. Los umbrales de humedad se aplican desde J1."))}</span>

            <button class="ghost" type="button" id="x-help-close">J'ai compris</button>
          </div>
          <div id="x-prev"></div>
        </div>
        <div class="list" id="f-lots"></div>
        <span class="lab" style="margin-top:6px">Ajouter un lot à la main</span>
        <div class="two">
          <div class="field"><label for="l-n">N° du lot</label><input id="l-n" type="text" inputmode="numeric" placeholder="Numéro"><span class="ex">Ex. : 12</span></div>
          <div class="field"><label for="l-v">Variété</label><input id="l-v" type="text" placeholder="Variété"><span class="ex">Ex. : SYR (Syrah)</span></div>
        </div>
        <div class="two">
          <div class="field"><label for="l-p">Porte-greffe</label><input id="l-p" type="text" placeholder="Porte-greffe"><span class="ex">Ex. : SO4</span></div>
          <div class="field"><label for="l-x">Palox <span class="hint">(facult.)</span></label><input id="l-x" class="num" type="text" inputmode="decimal" placeholder="N°"><span class="ex">Ex. : 4 ou 2,5</span></div>
        </div>
        <div class="field"><label for="l-q">Plants <span class="hint">(facultatif)</span></label><input id="l-q" class="num" type="text" inputmode="numeric" placeholder="Nombre de plants du lot"><span class="ex">Ex. : 25000</span></div>
        <div class="row"><button class="ghost" id="l-add" type="button">+ Ajouter ce lot</button><button class="ghost" id="l-cancel" type="button" hidden>Annuler</button></div>
      </div>
      <button class="primary" type="submit">${editing?'Enregistrer':'Créer la chauffe'}</button>
      <div class="status" id="f-st"></div>
    </form>
    ${editing?`<div class="card"><h3>Archiver ou supprimer</h3><p class="note">Une chauffe archivée reste consultable, en bas de la liste. La suppression retire la chauffe et toutes ses notes de cet appareil.</p>
      <div class="row"><button class="ghost" id="f-arch" type="button">${editing.archive?'Désarchiver':'Archiver'}</button><button class="ghost danger" id="f-del" type="button">Supprimer la chauffe</button></div><div class="status" id="f-st2"></div></div>`:''}
  </section>`;
  let editLot=null;
  const lotText=l=>'Lot '+l.lot+(l.variete||l.pg?' · '+[l.variete,l.pg].filter(Boolean).join(' / '):'')+(l.qte!=null?' · '+fmtN(l.qte)+' pl.':'')+(l.palox!=null?' · '+fmtN(l.palox)+' palox':'');
  const mkBtn=(txt,label,fn,dis)=>{ const b=document.createElement('button'); b.type='button'; b.className='ghost'; b.textContent=txt; b.setAttribute('aria-label',label); b.disabled=!!dis; b.onclick=fn; return b; };
  const resetLotInputs=()=>{ editLot=null; ['l-n','l-v','l-p','l-q','l-x'].forEach(id=>$(id).value=''); $('l-add').textContent='+ Ajouter ce lot'; $('l-cancel').hidden=true; };
  const drawLots=()=>{ const el=$('f-lots'); el.innerHTML=''; if(!formLots.length){ el.innerHTML='<div class="item empty">Aucun lot pour l\'instant.</div>'; return; }
    formLots.forEach((l,i)=>{ const d=document.createElement('div'); d.className='lotrow'+(l===editLot?' editing':'');
      const s=document.createElement('span'); s.className='lt'; s.textContent=lotText(l);
      const act=document.createElement('div'); act.className='lotact';
      act.append(
        mkBtn('↑','Monter le lot '+l.lot,()=>{ formLots.splice(i-1,0,formLots.splice(i,1)[0]); drawLots(); },i===0),
        mkBtn('↓','Descendre le lot '+l.lot,()=>{ formLots.splice(i+1,0,formLots.splice(i,1)[0]); drawLots(); },i===formLots.length-1),
        mkBtn('Modifier','Modifier le lot '+l.lot,()=>{ editLot=l; $('l-n').value=l.lot; $('l-v').value=l.variete||''; $('l-p').value=l.pg||''; $('l-q').value=l.qte!=null?fmtN(l.qte).replace(/\s/g,''):''; $('l-x').value=l.palox!=null?fmtN(l.palox):''; $('l-add').textContent='Enregistrer ce lot'; $('l-cancel').hidden=false; drawLots(); $('l-n').scrollIntoView({block:'center'}); }),
        mkBtn('Retirer','Retirer le lot '+l.lot,()=>{ if(l===editLot) resetLotInputs(); formLots.splice(i,1); drawLots(); })
      );
      act.lastChild.classList.add('danger');
      d.append(s,act); el.appendChild(d); }); };
  drawLots();

  // ---- Import Excel ----
  const toggleHelp=open=>{ const h=$('x-help'), b=$('x-help-btn'); const o=open===undefined?h.hidden:open; h.hidden=!o; b.setAttribute('aria-expanded',o); b.classList.toggle('on',o); };
  $('x-help-btn').onclick=()=>toggleHelp(); $('x-help-close').onclick=()=>{ toggleHelp(false); $('x-help-btn').focus(); };
  let xbook=null;
  const xStatus=(t,cls)=>{ $('f-st').textContent=t; $('f-st').className='status'+(cls?' '+cls:''); };
  const colName=(h,i)=>{ const t=String(h==null?'':h).replace(/\s+/g,' ').trim(); return t?'« '+t+' »':'colonne '+(i+1); };
  async function showSheet(idx){
    const prev=$('x-prev'); const sh=xbook.sheets[idx]; const rows=await xbook.read(sh);
    const res=detectLots(rows);
    if(!res||!res.lots.length){ prev.innerHTML=(xbook.sheets.length>1?sheetSel(idx):'')+'<div class="alertbox">Aucun lot trouvé dans '+(sh.name?'l\'onglet « '+esc(sh.name)+' »':'ce fichier')+'. Il faut une colonne dont le titre est « lot » ou « lote ».</div><button class="ghost" type="button" id="x-cancel">Fermer</button>'; bindSheetSel(); $('x-cancel').onclick=closeImport; return; }
    const M=res.map, H=res.headers;
    const found=[['lot','Lot'],['variete','Variété'],['pg','Porte-greffe'],['qteLot','Plants par lot'],['qte','Plants'],['palox','Palox']].filter(([k])=>M[k]!==undefined).map(([k,l])=>l+' = '+esc(colName(H[M[k]],M[k]))).join(' · ');
    const existing=new Set(formLots.map(l=>String(l.lot)));
    prev.innerHTML=(xbook.sheets.length>1?sheetSel(idx):'')+
      `<div class="card" style="gap:10px;padding:12px"><b>${res.lots.length} lot${res.lots.length>1?'s':''} trouvé${res.lots.length>1?'s':''}</b><span class="hint">Colonnes lues (ligne ${res.header}) : ${found}. Décoche les lots qui ne font pas partie de cette chauffe.</span>
      <div class="row"><button class="ghost" type="button" id="x-all">Tout cocher</button><button class="ghost" type="button" id="x-none">Tout décocher</button></div>
      <div class="xlist">${res.lots.map((l,i)=>`<label class="xrow"><input type="checkbox" data-i="${i}" checked><span>${esc(lotText(l))}${l.rows>1?' <span class="hint">('+l.rows+' lignes)</span>':''}${existing.has(String(l.lot))?' <span class="chip">remplace</span>':''}</span></label>`).join('')}</div>
      <div class="row"><button class="primary" type="button" id="x-ok">Ajouter les lots cochés</button><button class="ghost" type="button" id="x-cancel">Annuler</button></div></div>`;
    bindSheetSel();
    const boxes=()=>Array.from(prev.querySelectorAll('input[type=checkbox]'));
    $('x-all').onclick=()=>boxes().forEach(b=>b.checked=true); $('x-none').onclick=()=>boxes().forEach(b=>b.checked=false);
    $('x-cancel').onclick=closeImport;
    $('x-ok').onclick=()=>{ const pick=boxes().filter(b=>b.checked).map(b=>res.lots[Number(b.dataset.i)]); if(!pick.length){ xStatus('Coche au moins un lot.','err'); return; }
      let add=0, upd=0; pick.forEach(l=>{ const o={lot:l.lot, variete:l.variete, pg:l.pg, qte:l.qte, palox:l.palox}; const i=formLots.findIndex(x=>String(x.lot)===String(l.lot)); if(i>=0){ formLots[i]=o; upd++; } else { formLots.push(o); add++; } });
      closeImport(); drawLots(); xStatus(`${add} lot${add>1?'s':''} ajouté${add>1?'s':''}${upd?', '+upd+' remplacé'+(upd>1?'s':''):''}. Vérifie la liste puis touche « ${editing?'Enregistrer':'Créer la chauffe'} ».`,'ok'); };
  }
  function sheetSel(idx){ return `<div class="field"><label for="x-sheet">Onglet du fichier</label><select id="x-sheet">${xbook.sheets.map((s,i)=>`<option value="${i}"${i===idx?' selected':''}>${esc(s.name||('Feuille '+(i+1)))}</option>`).join('')}</select></div>`; }
  function bindSheetSel(){ const sel=$('x-sheet'); if(sel) sel.onchange=()=>showSheet(Number(sel.value)); }
  function closeImport(){ xbook=null; $('x-prev').innerHTML=''; }
  $('x-file').onchange=async e=>{ const f=e.target.files[0]; e.target.value=''; if(!f) return; xStatus('Lecture du fichier…');
    try{
      if(/\.csv$/i.test(f.name)||f.type==='text/csv'){ const rows=parseCsv(await f.text()); xbook={sheets:[{name:f.name}], read:async()=>rows}; }
      else { if(typeof DecompressionStream==='undefined'){ xStatus('Ce navigateur est trop ancien pour lire les fichiers Excel. Mets à jour le téléphone, ou enregistre le fichier en .csv.','err'); return; }
        const wb=await readXlsx(await f.arrayBuffer()); if(!wb.sheets.length) throw new Error('nosheet'); xbook={sheets:wb.sheets, read:wb.readSheet}; }
      xStatus(''); let start=0; for(let i=0;i<xbook.sheets.length;i++){ const r=detectLots(await xbook.read(xbook.sheets[i])); if(r&&r.lots.length){ start=i; break; } } await showSheet(start);
    }catch(err){ xStatus(/\.xls$/i.test(f.name)?'Ancien format .xls : ouvre le fichier dans Excel ou Numbers et enregistre-le en .xlsx.':'Fichier illisible. Utilise un fichier Excel .xlsx ou un .csv.','err'); }
  };
  $('l-cancel').onclick=()=>{ resetLotInputs(); drawLots(); };
  $('l-add').onclick=()=>{ const lot=$('l-n').value.trim(); if(!lot){ $('f-st').textContent='Indique au moins le numéro du lot.'; $('f-st').className='status err'; return; }
    const xs=$('l-x').value.trim(), qs=$('l-q').value.trim(); const palox=num(xs), qte=num(qs);
    if(xs && palox==null){ $('f-st').textContent='Nombre de palox illisible : tape par exemple 3 ou 2,5.'; $('f-st').className='status err'; return; }
    if(qs && qte==null){ $('f-st').textContent='Nombre de plants illisible.'; $('f-st').className='status err'; return; }
    const obj={lot, variete:$('l-v').value.trim(), pg:$('l-p').value.trim(), qte, palox};
    const idx=editLot?formLots.indexOf(editLot):-1;
    if(idx>=0) formLots[idx]=obj; else formLots.push(obj);
    const wasEdit=idx>=0; resetLotInputs(); $('f-st').textContent=wasEdit?'Lot modifié. Touche « Enregistrer » en bas pour garder les changements.':''; $('f-st').className='status'; drawLots(); if(!wasEdit) $('l-n').focus(); };
  $('f-back').onclick=()=>{ renderChauffeForm._init=false; editing?go('chauffe',{tab:'infos'}):go('home'); };
  $('f-form').onsubmit=async e=>{ e.preventDefault(); const st=$('f-st');
    const nom=$('f-nom').value.trim(); const duree=Math.round(num($('f-duree').value)||0), de=Math.round(num($('f-de').value)||0), a=Math.round(num($('f-a').value)||0);
    if(!nom){ st.textContent='Donne un nom à la chauffe.'; st.className='status err'; return; }
    if(duree<1||duree>90){ st.textContent='La durée doit être entre 1 et 90 jours.'; st.className='status err'; return; }
    if(de<1||a<de||a>duree){ st.textContent='La fin prévue doit être entre J1 et J'+duree+', avec le premier jour avant le second.'; st.className='status err'; return; }
    const sv={}; for(const [k,id,lab] of [['inMin','f-min','Minimum'],['inMax','f-max','Maximum'],['saut','f-saut','Variation'],['rappel','f-rap','Rappel'],['montee','f-mont','Montée'],['hInMin','f-hmin','Humidité'],['hInMax','f-hmax','Humidité'],['hExtMin','f-hext','Humidité'],['o2Min','f-o2','Oxygène']]){ const t=$(id).value.trim(); const v=num(t); if(t && v==null){ st.textContent='Seuil illisible ('+lab+') : tape seulement un nombre, par exemple 28 ou 28,5.'; st.className='status err'; return; } sv[k]=v; }
    if(sv.inMin!=null && sv.inMax!=null && sv.inMin>=sv.inMax){ st.textContent='Le minimum doit être plus petit que le maximum.'; st.className='status err'; return; }
    if(sv.montee!=null){ sv.montee=Math.round(sv.montee); if(sv.montee<1||sv.montee>=duree){ st.textContent=L('La montée doit se terminer entre J1 et J'+(duree-1)+'.','La subida debe terminar entre J1 y J'+(duree-1)+'.'); st.className='status err'; return; } }
    if([sv.hInMin,sv.hInMax,sv.hExtMin,sv.o2Min].some(v=>v!=null&&(v<0||v>100))){ st.textContent=L("Les seuils d'humidité doivent être entre 0 et 100 %.",'Los umbrales de humedad deben estar entre 0 y 100 %.'); st.className='status err'; return; }
    if(sv.hInMin!=null && sv.hInMax!=null && sv.hInMin>=sv.hInMax){ st.textContent=L("L'humidité minimum doit être plus petite que le maximum.",'La humedad mínima debe ser menor que la máxima.'); st.className='status err'; return; }
    if(sv.saut!=null && sv.saut<=0 || sv.rappel!=null && sv.rappel<=0){ st.textContent='La variation et le rappel doivent être plus grands que 0.'; st.className='status err'; return; }
    if($('l-n').value.trim()){ $('l-add').click(); }
    const ch = editing ? Object.assign({},editing) : {id:'ch-'+uid(), creeLe:nowIso(), creePar:S.me.nom};
    Object.assign(ch,{nom, duree, finDe:de, finA:a, debut:$('f-debut').value||'', notes:$('f-notes').value.trim(), lots:formLots, seuils:sv});
    await saveChauffe(ch); renderChauffeForm._init=false; toast(editing?'Chauffe enregistrée.':'Chauffe créée.');
    go('chauffe',{chauffeId:ch.id, tab:editing?'infos':'jour', jour:1}); };
  if(editing){
    $('f-arch').onclick=async()=>{ const ch=Object.assign({},editing,{archive:!editing.archive}); await saveChauffe(ch); renderChauffeForm._init=false; toast(ch.archive?'Chauffe archivée.':'Chauffe désarchivée.'); go('home'); };
    let conf=false; $('f-del').onclick=async()=>{ if(!conf){ conf=true; $('f-del').textContent='Toucher encore pour supprimer définitivement'; return; }
      const ch=Object.assign({},editing,{supprime:true}); await saveChauffe(ch);
      for(const e of entriesOf(ch.id)) await removeEntry(e);
      renderChauffeForm._init=false; toast('Chauffe supprimée.'); go('home'); };
  }
}

    catch(err){ stEl.textContent='Enregistrement impossible : stockage plein ou bloqué.'; stEl.className='status err'; } }
  $('j-addrel').onclick=addRel;

}

function drawChart(ch){
  const VIEWS={in:['in'],ext:['ext'],both:['in','ext']};
  const SER=[{k:'in',name:'Dans les palox',color:'var(--s-in)',fill:true},{k:'ext',name:'Extérieur des palox',color:'var(--s-ext)',fill:false}];
  const vEl=$('g-view'); vEl.innerHTML='';
  [['in','Dans les palox'],['ext','Extérieur'],['both','Superposer']].forEach(([k,l])=>{ const b=document.createElement('button'); b.type='button'; b.textContent=l; b.setAttribute('aria-pressed',S.courbe===k);
    b.onclick=()=>{ S.courbe=k; try{ localStorage.setItem(LS+'courbe',k); }catch(e){} $('g-tip').textContent='Touche un point de la courbe.'; drawChart(ch); }; vEl.appendChild(b); });
  const P={in:[],ext:[]};
  releves(ch.id).forEach(r=>{ let f=0.5; if(r.heure&&/^\d{1,2}:\d{2}$/.test(r.heure)){ const [h,m]=r.heure.split(':').map(Number); f=(h+m/60)/24; }
    const base={t:r.jour-1+f, r}; if(r.tInt!=null) P.in.push(Object.assign({v:r.tInt},base)); if(r.tExt!=null) P.ext.push(Object.assign({v:r.tExt},base)); });
  P.in.sort((a,b)=>a.t-b.t); P.ext.sort((a,b)=>a.t-b.t);
  const shown=SER.filter(s=>VIEWS[S.courbe].includes(s.k)); const D=ch.duree;
  const W=640,H=270,ml=34,mr=56,mt=22,mb=30,pw=W-ml-mr,ph=H-mt-mb;
  const all=[].concat(...shown.map(s=>P[s.k])).map(p=>p.v);
  const SU=seuilsOf(ch), showIn=VIEWS[S.courbe].includes('in'); const lims=showIn?[SU.inMin,SU.inMax].filter(v=>v!=null):[];
  const span=all.concat(lims);
  let lo=span.length?Math.floor((Math.min(...span)-2)/5)*5:10, hi=span.length?Math.ceil((Math.max(...span)+2)/5)*5:35; if(hi-lo<10) hi=lo+10;
  const X=t=>ml+t/D*pw, Y=v=>mt+(hi-v)/(hi-lo)*ph;
  let g=`<rect class="zone" x="${X(ch.finDe-1)}" y="${mt}" width="${X(ch.finA)-X(ch.finDe-1)}" height="${ph}"></rect><text class="zonet" x="${(X(ch.finDe-1)+X(ch.finA))/2}" y="${mt-6}" text-anchor="middle">fin prévue</text>`;
  for(let v=lo;v<=hi;v+=5) g+=`<line class="grid" x1="${ml}" x2="${ml+pw}" y1="${Y(v)}" y2="${Y(v)}"></line><text x="${ml-6}" y="${Y(v)+4}" text-anchor="end">${v}°</text>`;
  const step=Math.max(1,Math.ceil(D/7)); for(let j=1;j<=D;j+=step) g+=`<text x="${X(j-0.5)}" y="${H-8}" text-anchor="middle">J${j}</text>`;
  const sx=SU.montee!=null?X(SU.montee):ml;
  if(showIn && SU.montee!=null && (SU.inMin!=null||SU.inMax!=null)) g+=`<text class="zonet" x="${(ml+sx)/2}" y="${mt+12}" text-anchor="middle">${esc(L('montée','subida'))}</text>`;
  if(showIn){ if(SU.inMax!=null) g+=`<line class="seuil" x1="${sx}" x2="${ml+pw}" y1="${Y(SU.inMax)}" y2="${Y(SU.inMax)}"></line><text class="seuilt" x="${ml+pw+4}" y="${Y(SU.inMax)+4}">${L('max','máx')} ${fmtN(SU.inMax)}°</text>`;
    if(SU.inMin!=null) g+=`<line class="seuil" x1="${sx}" x2="${ml+pw}" y1="${Y(SU.inMin)}" y2="${Y(SU.inMin)}"></line><text class="seuilt" x="${ml+pw+4}" y="${Y(SU.inMin)+4}">${L('min','mín')} ${fmtN(SU.inMin)}°</text>`; }
  const pts=[];
  shown.forEach(s=>{ const a=P[s.k]; if(!a.length) return;
    if(a.length>1) g+=`<polyline fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${a.map(p=>X(p.t).toFixed(1)+','+Y(p.v).toFixed(1)).join(' ')}"></polyline>`;
    a.forEach(p=>{ const cap=p.r.source==='capteur', out=s.k==='in'&&relOut(ch,p.r); const col=out?'var(--bad)':s.color;
      g+= cap ? `<circle cx="${X(p.t).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${out?2.6:1.8}" fill="${col}"></circle>` : `<circle cx="${X(p.t).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="4.5" fill="${s.fill||out?col:'var(--surface)'}" stroke="${s.fill||out?'var(--surface)':col}" stroke-width="2"></circle>`; pts.push({p,s}); });
    const last=a[a.length-1]; g+=`<text class="lbl" x="${X(last.t)+9}" y="${Y(last.v)+4+(S.courbe==='both'?(s.k==='ext'?6:-4):0)}">${fmtN(last.v)} °C</text>`; });
  const hr=pts.length>120?6:13; pts.forEach((o,i)=>{ g+=`<circle class="hit" data-i="${i}" cx="${X(o.p.t).toFixed(1)}" cy="${Y(o.p.v).toFixed(1)}" r="${hr}"></circle>`; });
  const svg=$('chart'); svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.innerHTML=g;
  svg.querySelectorAll('.hit').forEach(c=>c.onclick=()=>{ const o=pts[Number(c.dataset.i)], r=o.p.r;
    $('g-tip').innerHTML='<b>'+esc(fmtN(o.p.v))+' °C</b>'+(humText(r)?' · '+esc(humText(r)):'')+' · '+esc(o.s.name.toLowerCase())+' · J'+r.jour+(ch.debut?' ('+esc(dayShort(ch,r.jour))+')':'')+(r.heure?' à '+esc(fmtH(r.heure)):'')+' · '+esc(r.source==='capteur'?L('capteur','sensor')+' « '+(r.capteur||'?')+' »':authorName(r))+(relOut(ch,r)&&o.s.k==='in'?' · <span class="al">'+esc(L('hors seuil','fuera de umbral'))+'</span>':''); });
  $('g-leg').innerHTML=shown.filter(s=>P[s.k].length).map(s=>`<span><svg width="22" height="10" aria-hidden="true"><line x1="1" x2="21" y1="5" y2="5" stroke="${s.color}" stroke-width="2"></line><circle cx="11" cy="5" r="3.5" fill="${s.fill?s.color:'var(--surface)'}" stroke="${s.color}" stroke-width="1.5"></circle></svg>${esc(s.name)}</span>`).join('');
  const hk=S.courbe==='ext'?'ext':'in', li=P[hk][P[hk].length-1];
  $('g-title').textContent=li?(hk==='in'?'Dans les palox : ':'Extérieur des palox : ')+fmtN(li.v)+' °C au dernier relevé (J'+li.r.jour+')':'Températures';
  if(!all.length) $('g-tip').textContent=S.courbe==='both'?'Aucun relevé pour l\'instant : ajoute-en un dans l\'onglet Saisie.':'Aucun relevé pour cette courbe pour l\'instant.';
}

const T = s => (S.lang==='es' && typeof ES!=='undefined' && ES[s]) ? ES[s] : s;

  const hp=[]; if(s.hInMin!=null||s.hInMax!=null) hp.push(L('palox ','palox ')+(s.hInMin!=null&&s.hInMax!=null?fmtN(s.hInMin)+'–'+fmtN(s.hInMax)+' %':(s.hInMin!=null?L('min. ','mín. ')+fmtN(s.hInMin):L('max. ','máx. ')+fmtN(s.hInMax))+' %')); if(s.hExtMin!=null) hp.push(L('pièce min. ','sala mín. ')+fmtN(s.hExtMin)+' %');
  if(hp.length) p.push(L('humidité ','humedad ')+hp.join(', '));

/* ---------- 1. Import d'enregistreur ---------- */
const TIME_RE=/^(\d{1,2}):(\d{2})(?::(\d{2}))?\s*([AaPp]\.?\s?[Mm]\.?)?$/;
function timeMinutes(v){
  if(typeof v==='number') return (v>=0 && v<1) ? Math.round(v*1440) : null;
  const m=TIME_RE.exec(String(v==null?'':v).trim()); if(!m) return null;
  let h=+m[1]; const mi=+m[2]; if(m[4]){ const pm=/p/i.test(m[4]); if(h===12) h=pm?12:0; else if(pm) h+=12; }
  return h<24 && mi<60 ? h*60+mi : null;
}
/* Renvoie {d:Date, t:bool (heure présente)} ou null. order = 'dmy' ou 'mdy' pour les dates du type 05/10/2026. */
function parseStamp(v, order){
  if(v==null || v==='') return null;
  if(v instanceof Date) return isNaN(v)?null:{d:v,t:true};
  if(typeof v==='number'){
    if(v>20000 && v<90000){ const ms=Math.round((v-25569)*86400000); const u=new Date(ms); return {d:new Date(u.getUTCFullYear(),u.getUTCMonth(),u.getUTCDate(),u.getUTCHours(),u.getUTCMinutes(),u.getUTCSeconds()), t:v%1!==0}; }
    if(v>1e9 && v<4e9) return {d:new Date(v*1000), t:true};
    if(v>1e12 && v<4e12) return {d:new Date(v), t:true};
    return null;
  }
  const s=String(v).trim().replace(/\s+/g,' ');
  let m=/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})(?:[T ,]+(\d{1,2}):(\d{2})(?::(\d{2})(?:[.,]\d+)?)?\s*([AaPp]\.?\s?[Mm]\.?)?)?(?:\s*(?:Z|[+-]\d{2}:?\d{2}))?$/.exec(s);
  let y, mo, da, h=0, mi=0, se=0, t=false, ap='';
  if(m){ y=+m[1]; mo=+m[2]; da=+m[3]; if(m[4]!=null){ h=+m[4]; mi=+m[5]; se=+(m[6]||0); t=true; ap=m[7]||''; } }
  else {
    m=/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})(?:[T ,]+(\d{1,2}):(\d{2})(?::(\d{2})(?:[.,]\d+)?)?\s*([AaPp]\.?\s?[Mm]\.?)?)?$/.exec(s);
    if(!m) return null;
    const a=+m[1], b=+m[2]; y=+m[3]; if(y<100) y+=2000;
    if(order==='mdy'){ mo=a; da=b; } else { da=a; mo=b; }
    if(m[4]!=null){ h=+m[4]; mi=+m[5]; se=+(m[6]||0); t=true; ap=m[7]||''; }
  }
  if(ap){ const pm=/p/i.test(ap); if(h===12) h=pm?12:0; else if(pm) h+=12; }
  if(mo<1||mo>12||da<1||da>31||h>23||mi>59) return null;
  const d=new Date(y,mo-1,da,h,mi,se); return isNaN(d)?null:{d,t};
}
const stampKind = v => { const p=parseStamp(v,'dmy')||parseStamp(v,'mdy'); return p ? (p.t?'dt':'d') : ''; };
function dateOrder(rows, from, col){
  for(let r=from;r<rows.length;r++){ const v=(rows[r]||[])[col]; if(typeof v!=='string') continue; const m=/^\s*(\d{1,2})[-\/.](\d{1,2})[-\/.]\d{2,4}/.exec(v); if(!m) continue; if(+m[1]>12) return 'dmy'; if(+m[2]>12) return 'mdy'; }
  return 'dmy';
}
function detectSensor(rows){
  const N=Math.min(rows.length,40);
  for(let r=-1;r<N;r++){
    const hdr=r<0?[]:(rows[r]||[]); const data=[];
    for(let k=r+1;k<rows.length && data.length<10;k++){ if((rows[k]||[]).some(v=>v!=null&&v!=='')) data.push(rows[k]); }
    if(data.length<2) continue;
    const width=Math.max(hdr.length,...data.map(x=>x.length));
    const major=fn=>data.filter(fn).length>=Math.ceil(data.length*0.8);
    let dateCol=-1;
    for(let c=0;c<width;c++){ if(major(x=>stampKind(x[c])!=='')){ dateCol=c; break; } }
    if(dateCol<0) continue;
    if(r>=0 && stampKind(hdr[dateCol])!=='') continue;
    if(r<0 && rows.slice(0,1).some(x=>x && stampKind(x[dateCol])==='')) continue;
    let timeCol=-1;
    if(major(x=>stampKind(x[dateCol])==='d')){ for(let c=0;c<width;c++){ if(c!==dateCol && major(x=>timeMinutes(x[c])!=null)){ timeCol=c; break; } } }
    const numCols=[]; for(let c=0;c<width;c++){ if(c===dateCol||c===timeCol) continue; if(major(x=>strictNum(x[c])!=null)) numCols.push(c); }
    const hn=c=>String(hdr[c]==null?'':hdr[c]).toLowerCase();
    let tempCol=numCols.find(c=>/temp|°|deg|celsius|fahrenheit|\bt\b|^t\s|tc\b/.test(hn(c)));
    let humCol=numCols.find(c=>c!==tempCol && /hum|\brh\b|\bhr\b|%/.test(hn(c)));
    if(tempCol===undefined) tempCol=numCols.find(c=>c!==humCol && !/^(n|no|nº|n°|#|id|index|point|punto)$/i.test(hn(c).trim()) && data.every(x=>{ const v=strictNum(x[c]); return v==null||(v>-30&&v<130); }));
    return {row:r, dateCol, timeCol, numCols, tempCol:tempCol===undefined?-1:tempCol, humCol:humCol===undefined?-1:humCol, width};
  }
  return null;
}
async function readTableFile(f){
  if(/\.(csv|txt|tsv)$/i.test(f.name)||/text\//.test(f.type)){ const rows=parseCsvRaw(await f.text()); return {sheets:[{name:f.name}], read:async()=>rows}; }
  if(typeof DecompressionStream==='undefined') throw new Error('old');
  const wb=await readXlsx(await f.arrayBuffer()); if(!wb.sheets.length) throw new Error('nosheet'); return {sheets:wb.sheets, read:wb.readSheet};
}
/* CSV sans conversion des nombres à virgule ambiguë : on garde le texte des dates. */
function parseCsvRaw(text){
  text=text.replace(/^﻿/,'');
  const lines=text.split(/\r?\n/).filter(l=>l.trim()).slice(0,20).map(l=>l.replace(/"[^"]*"/g,'""'));
  /* Séparateur : celui qui donne le même nombre de colonnes (au moins 2) sur le plus de lignes ; à égalité, ; puis tabulation puis virgule. */
  const score=ch=>{ const c=lines.map(l=>l.split(ch).length); const m={}; c.forEach(x=>{ if(x>1) m[x]=(m[x]||0)+1; }); return Math.max(0,...Object.values(m)); };
  const sep=[';','\t',','].reduce((best,ch)=>score(ch)>score(best)?ch:best,';');
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=ch; }
    else if(ch==='"') q=true; else if(ch===sep){ row.push(cur); cur=''; } else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(cur); rows.push(row); row=[]; cur=''; } else cur+=ch; }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows.map(r=>r.map(v=>v.trim()));
}

function bindSensorCard(ch){
  const det=$('sc'); det.addEventListener('toggle',()=>{ S.sensorOpen=det.open; });
  const stEl=$('sc-st'), prev=$('sc-prev');
  const st=(t,c)=>{ stEl.textContent=t; stEl.className='status'+(c?' '+c:''); };
  const clr=$('sc-clear'); if(clr){ let c=false; clr.onclick=async()=>{ if(!c){ c=true; clr.textContent=L('Toucher encore pour tout retirer','Tocar otra vez para quitar todo'); return; }
    const list=entriesOf(ch.id,'releve').filter(r=>r.source==='capteur').map(r=>Object.assign({},r,{supprime:true})); await saveEntries(list); toast(L('Mesures du capteur retirées.','Mediciones del sensor quitadas.')); renderChauffe(); }; }
  let book=null, rows=null, cfg=null, fname='';
  $('sc-file').onchange=async e=>{ const f=e.target.files[0]; e.target.value=''; if(!f) return; st(L('Lecture du fichier…','Leyendo el archivo…'));
    fname=f.name.replace(/\.[^.]+$/,'').slice(0,40)||L('capteur','sensor');
    try{ book=await readTableFile(f); let idx=0; for(let i=0;i<book.sheets.length;i++){ if(detectSensor(await book.read(book.sheets[i]))){ idx=i; break; } } st(''); await show(idx); }
    catch(err){ st(err&&err.message==='old'?L("Ce navigateur est trop ancien pour lire les fichiers Excel : enregistre le fichier en .csv.",'Este navegador es demasiado antiguo para leer archivos Excel: guarda el archivo en .csv.'):L('Fichier illisible. Utilise un fichier .csv ou .xlsx.','Archivo ilegible. Usa un archivo .csv o .xlsx.'),'err'); }
  };
  async function show(idx){
    rows=await book.read(book.sheets[idx]); const d=detectSensor(rows);
    const sheetSel=book.sheets.length>1?`<div class="field"><label for="sc-sheet">${esc(L('Onglet du fichier','Pestaña del archivo'))}</label><select id="sc-sheet">${book.sheets.map((s,i)=>`<option value="${i}"${i===idx?' selected':''}>${esc(s.name||('Feuille '+(i+1)))}</option>`).join('')}</select></div>`:'';
    if(!d){ prev.innerHTML=sheetSel+`<div class="alertbox">${esc(L("Aucune colonne de date et heure reconnue. Il faut une colonne avec la date et l'heure de chaque mesure (ex. 05/10/2026 14:00).","No se reconoce ninguna columna de fecha y hora. Hace falta una columna con la fecha y hora de cada medición (ej. 05/10/2026 14:00)."))}</div>`; bindSheet(); return; }
    cfg={row:d.row, dateCol:d.dateCol, timeCol:d.timeCol, tCol:d.tempCol, hCol:d.humCol, pos:'in', step:60, name:fname, f2c:false, width:d.width};
    const tv=[]; for(let r=d.row+1;r<rows.length&&tv.length<50;r++){ const v=strictNum((rows[r]||[])[cfg.tCol]); if(v!=null) tv.push(v); }
    tv.sort((a,b)=>a-b); cfg.f2c = tv.length ? tv[Math.floor(tv.length/2)]>45 : false;
    draw(sheetSel);
  }
  function bindSheet(){ const sel=$('sc-sheet'); if(sel) sel.onchange=()=>show(Number(sel.value)); }
  const colLabel=c=>{ if(c<0) return L('— aucune —','— ninguna —'); const h=cfg.row>=0?(rows[cfg.row]||[])[c]:null; const t=String(h==null?'':h).replace(/\s+/g,' ').trim(); const ex=(rows[cfg.row+1]||[])[c]; return (t||L('colonne ','columna ')+(c+1))+(ex!=null&&ex!==''?' (ex. '+String(ex).slice(0,22)+')':''); };
  const colOpts=(sel,withNone)=>(withNone?`<option value="-1"${sel<0?' selected':''}>${esc(colLabel(-1))}</option>`:'')+Array.from({length:cfg.width},(_,c)=>`<option value="${c}"${c===sel?' selected':''}>${esc(colLabel(c))}</option>`).join('');
  function draw(sheetSel){
