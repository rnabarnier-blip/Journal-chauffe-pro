  return `<details class="card sensor" id="sc"${S.sensorOpen?' open':''}>
    <summary><h3>${esc(L('Importer un enregistreur de température','Importar un registrador de temperatura'))}</h3><span class="hint">${esc(L('capteur, sonde, data logger','sensor, sonda, data logger'))}</span></summary>
    <p class="note">${esc(L("Si un capteur mesure la température (et l'humidité) dans les palox, exporte ses mesures en .csv ou .xlsx depuis son application, puis choisis le fichier ici. Les mesures sont rangées jour par jour dans cette chauffe et apparaissent sur la courbe.","Si un sensor mide la temperatura (y la humedad) en los palox, exporta sus mediciones en .csv o .xlsx desde su aplicación y elige el archivo aquí. Las mediciones se ordenan día por día en esta calefacción y aparecen en la curva."))}</p>
    ${ch.debut?'':`<div class="alertbox warnbox"><span>${esc(L("Il faut d'abord une date de début pour cette chauffe (onglet Infos → Modifier) : elle sert à ranger les mesures par jour.","Primero hace falta una fecha de inicio para esta calefacción (pestaña Infos → Modificar): sirve para ordenar las mediciones por día."))}</span></div>`}
    <label class="ghost filebtn${ch.debut?'':' disabled'}" for="sc-file">${esc(L('Choisir le fichier du capteur','Elegir el archivo del sensor'))}</label><input class="vh" id="sc-file" type="file" accept=".csv,.txt,.tsv,.xlsx,text/csv,text/plain,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"${ch.debut?'':' disabled'}>
    <div id="sc-prev"></div>
    <div class="status" id="sc-st"></div>
    ${n?`<div class="row"><span class="note">${esc(plural(n,'mesure','mesures','medición','mediciones'))} ${esc(L('de capteur dans cette chauffe.','de sensor en esta calefacción.'))}</span><button class="ghost danger" type="button" id="sc-clear">${esc(L('Tout retirer','Quitar todo'))}</button></div>`:''}
  </details>`;
}
function bindSensorCard(ch){
  const det=$('sc'); det.addEventListener('toggle',()=>{ S.sensorOpen=det.open; });
  const stEl=$('sc-st'), prev=$('sc-prev');
  const st=(t,c)=>{ stEl.textContent=t; stEl.className='status'+(c?' '+c:''); };
  const clr=$('sc-clear'); if(clr){ let c=false; clr.onclick=async()=>{ if(!c){ c=true; clr.textContent=L('Toucher encore pour tout retirer','Tocar otra vez para quitar todo'); return; }
    const list=entriesOf(ch.id,'releve').filter(r=>r.source==='capteur').map(r=>Object.assign({},r,{supprime:true})); await saveEntries(list); toast(L('Mesures du capteur retirées.','Mediciones del sensor quitadas.')); renderChauffe(); }; }
  let book=null, rows=null, cfg=null, fname='';
  $('sc-file').onchange=async e=>{ const f=e.target.files[0]; e.target.value=''; if(!f) return; st(L('Lecture du fichier…','Leyendo el archivo…'));
    fname=f.name.replace(/\.[^.]+$/,'').slice(0,40)||L('capteur','sensor');
    try{ book=await readTableFile(f); let idx=0; for(let i=0;i<book.sheets.length;i++){ if(detectSensor(await book.read(book.sheets[i]))){ idx=i; break; } } st(''); await show(idx); }
    catch(err){ st(err&&err.message==='old'?L("Ce navigateur est trop ancien pour lire les fichiers Excel : enregistre le fichier en .csv.",'Este navegador es demasiado antiguo para leer archivos Excel: guarda el archivo en .csv.'):L('Fichier illisible. Utilise un fichier .csv ou .xlsx.','Archivo ilegible. Usa un archivo .csv o .xlsx.'),'err'); }
  };
  async function show(idx){
    rows=await book.read(book.sheets[idx]); const d=detectSensor(rows);
    const sheetSel=book.sheets.length>1?`<div class="field"><label for="sc-sheet">${esc(L('Onglet du fichier','Pestaña del archivo'))}</label><select id="sc-sheet">${book.sheets.map((s,i)=>`<option value="${i}"${i===idx?' selected':''}>${esc(s.name||('Feuille '+(i+1)))}</option>`).join('')}</select></div>`:'';
    if(!d){ prev.innerHTML=sheetSel+`<div class="alertbox">${esc(L("Aucune colonne de date et heure reconnue. Il faut une colonne avec la date et l'heure de chaque mesure (ex. 05/10/2026 14:00).","No se reconoce ninguna columna de fecha y hora. Hace falta una columna con la fecha y hora de cada medición (ej. 05/10/2026 14:00)."))}</div>`; bindSheet(); return; }
    cfg={row:d.row, dateCol:d.dateCol, timeCol:d.timeCol, tCol:d.tempCol, hCol:d.humCol, pos:'in', step:60, name:fname, f2c:false, width:d.width};
    const tv=[]; for(let r=d.row+1;r<rows.length&&tv.length<50;r++){ const v=strictNum((rows[r]||[])[cfg.tCol]); if(v!=null) tv.push(v); }
    tv.sort((a,b)=>a-b); cfg.f2c = tv.length ? tv[Math.floor(tv.length/2)]>45 : false;
    draw(sheetSel);
  }
  function bindSheet(){ const sel=$('sc-sheet'); if(sel) sel.onchange=()=>show(Number(sel.value)); }
  const colLabel=c=>{ if(c<0) return L('— aucune —','— ninguna —'); const h=cfg.row>=0?(rows[cfg.row]||[])[c]:null; const t=String(h==null?'':h).replace(/\s+/g,' ').trim(); const ex=(rows[cfg.row+1]||[])[c]; return (t||L('colonne ','columna ')+(c+1))+(ex!=null&&ex!==''?' (ex. '+String(ex).slice(0,22)+')':''); };
  const colOpts=(sel,withNone)=>(withNone?`<option value="-1"${sel<0?' selected':''}>${esc(colLabel(-1))}</option>`:'')+Array.from({length:cfg.width},(_,c)=>`<option value="${c}"${c===sel?' selected':''}>${esc(colLabel(c))}</option>`).join('');
  function draw(sheetSel){
    prev.innerHTML=sheetSel+`<div class="card" style="gap:12px;padding:12px">
      <div class="field"><label for="sc-dc">${esc(L('Colonne date / heure','Columna fecha / hora'))}</label><select id="sc-dc">${colOpts(cfg.dateCol,false)}</select></div>
      ${cfg.timeCol>=0?`<div class="field"><label for="sc-tc">${esc(L('Colonne heure','Columna hora'))}</label><select id="sc-tc">${colOpts(cfg.timeCol,true)}</select></div>`:''}
      <div class="field"><label for="sc-t">${esc(L('Colonne température','Columna temperatura'))}</label><select id="sc-t">${colOpts(cfg.tCol,true)}</select></div>
      <div class="field"><label for="sc-h">${esc(L('Colonne humidité','Columna humedad'))} <span class="hint">${esc(L('(facultatif)','(opcional)'))}</span></label><select id="sc-h">${colOpts(cfg.hCol,true)}</select></div>
      <label class="check"><input type="checkbox" id="sc-f"${cfg.f2c?' checked':''}> ${esc(L('Les températures sont en °F : convertir en °C','Las temperaturas están en °F: convertir a °C'))}</label>
      <div class="field"><span class="lab">${esc(L('Où était le capteur ?','¿Dónde estaba el sensor?'))}</span><div class="seg" id="sc-pos"><button type="button" data-v="in" aria-pressed="${cfg.pos==='in'}">${esc(L('Dans un palox','Dentro de un palox'))}</button><button type="button" data-v="ext" aria-pressed="${cfg.pos==='ext'}">${esc(L('Dans la pièce (hors palox)','En la sala (fuera del palox)'))}</button></div></div>
      <div class="field"><span class="lab">${esc(L('Garder','Guardar'))}</span><div class="seg" id="sc-step"><button type="button" data-v="60" aria-pressed="${cfg.step===60}">${esc(L('1 valeur par heure','1 valor por hora'))}</button><button type="button" data-v="30" aria-pressed="${cfg.step===30}">${esc(L('toutes les 30 min','cada 30 min'))}</button><button type="button" data-v="0" aria-pressed="${cfg.step===0}">${esc(L('toutes les mesures','todas las mediciones'))}</button></div><span class="ex">${esc(L('Avec « 1 valeur par heure », l\'app fait la moyenne des mesures de chaque heure.','Con « 1 valor por hora », la app promedia las mediciones de cada hora.'))}</span></div>
      <div class="field"><label for="sc-n">${esc(L('Nom du capteur','Nombre del sensor'))}</label><input id="sc-n" type="text" value="${esc(cfg.name)}"><span class="ex">${esc(L('Ex. : palox 12, fond de la salle. Réimporter avec le même nom remplace les mesures.','Ej.: palox 12, fondo de la sala. Reimportar con el mismo nombre reemplaza las mediciones.'))}</span></div>
      <div class="sumbox" id="sc-sum"></div>
      <div class="row"><button class="primary" type="button" id="sc-ok">${esc(L('Importer ces mesures','Importar estas mediciones'))}</button><button class="ghost" type="button" id="sc-x">${esc(L('Annuler','Cancelar'))}</button></div>
    </div>`;
    bindSheet();
    const re=()=>{ cfg.dateCol=Number($('sc-dc').value); if($('sc-tc')) cfg.timeCol=Number($('sc-tc').value); cfg.tCol=Number($('sc-t').value); cfg.hCol=Number($('sc-h').value); cfg.f2c=$('sc-f').checked; cfg.name=$('sc-n').value.trim()||fname; summary(); };
    ['sc-dc','sc-tc','sc-t','sc-h','sc-f'].forEach(id=>{ const el=$(id); if(el) el.onchange=re; }); $('sc-n').oninput=()=>{ cfg.name=$('sc-n').value.trim()||fname; };
    [['sc-pos','pos',v=>v],['sc-step','step',Number]].forEach(([id,k,cv])=>$(id).querySelectorAll('button').forEach(b=>b.onclick=()=>{ cfg[k]=cv(b.dataset.v); $(id).querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b)); summary(); }));
    $('sc-x').onclick=()=>{ prev.innerHTML=''; st(''); };
    $('sc-ok').onclick=async()=>{ const res=compute(); if(!res.list.length){ st(L('Aucune mesure à importer dans les dates de la chauffe.','Ninguna medición para importar en las fechas de la calefacción.'),'err'); return; }
      $('sc-ok').disabled=true; st(L('Import en cours…','Importando…'));
      try{ const old=entriesOf(ch.id,'releve').filter(r=>r.source==='capteur' && r.capteur===cfg.name && r.pos===cfg.pos && !res.list.some(x=>x.id===r.id)).map(r=>Object.assign({},r,{supprime:true}));
        await saveEntries(res.list.concat(old)); S.sensorOpen=false;
        toast(L(res.list.length+' relevés de capteur importés.',res.list.length+' lecturas de sensor importadas.')); renderChauffe(); }
      catch(err){ $('sc-ok').disabled=false; st(L('Import impossible : stockage plein ou bloqué.','Importación imposible: almacenamiento lleno o bloqueado.'),'err'); } };
    summary();
  }
  function compute(){
    const order=dateOrder(rows, cfg.row+1, cfg.dateCol);
    const start=new Date(ch.debut+'T00:00:00');
    let total=0, inside=0, first=null, last=null, tMin=null, tMax=null; const buckets=new Map();
    for(let r=cfg.row+1;r<rows.length;r++){ const row=rows[r]||[];
      const p=parseStamp(row[cfg.dateCol],order); if(!p) continue; let d=p.d;
      if(cfg.timeCol>=0 && !p.t){ const mi=timeMinutes(row[cfg.timeCol]); if(mi==null) continue; d=new Date(d.getFullYear(),d.getMonth(),d.getDate(),Math.floor(mi/60),mi%60); }
      let t=cfg.tCol>=0?strictNum(row[cfg.tCol]):null; const h=cfg.hCol>=0?strictNum(row[cfg.hCol]):null;
      if(t!=null && cfg.f2c) t=(t-32)*5/9;
      if(t==null && h==null) continue; total++;
      if(!first||d<first) first=d; if(!last||d>last) last=d;
      const day=new Date(d.getFullYear(),d.getMonth(),d.getDate());
      const jour=Math.round((day-start)/86400000)+1; if(jour<1||jour>ch.duree) continue; inside++;
      if(t!=null){ tMin=tMin==null?t:Math.min(tMin,t); tMax=tMax==null?t:Math.max(tMax,t); }
      const mins=d.getHours()*60+d.getMinutes(); const slot=cfg.step?Math.floor(mins/cfg.step)*cfg.step:mins; const key=jour+':'+slot;
      let b=buckets.get(key); if(!b){ b={jour, slot, ts:[], hs:[]}; buckets.set(key,b); } if(t!=null) b.ts.push(t); if(h!=null) b.hs.push(h);
    }
    const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length*10)/10:null;
    const key=slug(cfg.name);
    const list=Array.from(buckets.values()).sort((a,b)=>a.jour-b.jour||a.slot-b.slot).map(b=>{ const heure=String(Math.floor(b.slot/60)).padStart(2,'0')+':'+String(b.slot%60).padStart(2,'0'); const t=avg(b.ts);
      return {id:'cap:'+ch.id+':'+cfg.pos+':'+key+':'+b.jour+':'+heure, type:'releve', source:'capteur', capteur:cfg.name, pos:cfg.pos, chauffeId:ch.id, jour:b.jour, heure, tExt:cfg.pos==='ext'?t:null, tInt:cfg.pos==='in'?t:null, humExt:cfg.pos==='ext'?avg(b.hs):null, humInt:cfg.pos==='in'?avg(b.hs):null, auteurId:S.me.id, auteurNom:S.me.nom, creeLe:nowIso()}; });
    return {total, inside, first, last, tMin, tMax, list};
  }
  function summary(){ const r=compute(); const f=d=>d?String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'):'';
    const el=$('sc-sum'); if(!r.total){ el.innerHTML=`<span class="al">${esc(L('Aucune mesure lisible avec ces colonnes.','Ninguna medición legible con estas columnas.'))}</span>`; return; }
    el.innerHTML=`<b>${esc(plural(r.total,'mesure lue','mesures lues','medición leída','mediciones leídas'))}</b> ${esc(L('du ','del '))+esc(f(r.first))+esc(L(' au ',' al '))+esc(f(r.last))}<br>`+
      `${esc(plural(r.inside,'mesure','mesures','medición','mediciones'))} ${esc(L('dans les dates de la chauffe (J1 à J','dentro de las fechas de la calefacción (J1 a J')+ch.duree+')')} → <b>${esc(plural(r.list.length,'relevé','relevés','lectura','lecturas'))}</b>`+
      (r.tMin!=null?`<br>${esc(L('Températures : ','Temperaturas: ')+fmtN(Math.round(r.tMin*10)/10)+L(' à ',' a ')+fmtN(Math.round(r.tMax*10)/10)+' °C')}`:'')+
      (r.tMax!=null&&r.tMax>45&&!cfg.f2c?`<br><span class="al">${esc(L('Valeurs très élevées : le capteur est peut-être en °F.','Valores muy altos: quizás el sensor está en °F.'))}</span>`:'')+
      (r.total&&!r.inside?`<br><span class="al">${esc(L('Aucune mesure ne tombe dans les dates de la chauffe : vérifie la date de début de la chauffe et la colonne date.','Ninguna medición cae en las fechas de la calefacción: revisa la fecha de inicio y la columna de fecha.'))}</span>`:'');
  }
}

function bindPhyto(ch, J){

  $('ph-prod').oninput=()=>{ if(catSel && $('ph-prod').value.trim()!==catSel.n){ catSel=null; amm=''; showInfo(); } drawSug(); };

  $('ph-meth').querySelectorAll('button').forEach(b=>b.onclick=()=>setMeth(meth===b.dataset.v?'':b.dataset.v));

  const open=e=>{ editing=e||null; fill(e); form.hidden=false; $('ph-open').hidden=true; $('ph-st').textContent=''; $('ph-ok').textContent=e?L('Enregistrer les modifications','Guardar los cambios'):L('Enregistrer le traitement','Guardar el tratamiento'); $('ph-prod').focus(); };
  const close=()=>{ editing=null; form.hidden=true; $('ph-open').hidden=false; };
  $('ph-open').onclick=()=>open(null); $('ph-x').onclick=close;
  $('ph-prod').onchange=()=>{ if(editing) return; const k=knownProducts().find(e=>e.produit.toLowerCase()===$('ph-prod').value.trim().toLowerCase()); if(!k) return;
    if(!$('ph-mat').value) $('ph-mat').value=k.matiere||''; if(!$('ph-dose').value&&k.dose!=null) $('ph-dose').value=fmtN(k.dose); if(k.unite) $('ph-unit').value=k.unite; if(!meth) setMeth(k.methode);

  if(!list.length){ el.innerHTML=`<div class="rel none">${esc(L('Aucun traitement ce jour-là.','Ningún tratamiento ese día.'))}</div>`; return; }

    if(isMine(e)){ const act=document.createElement('div'); act.className='lotact';
      const m=document.createElement('button'); m.type='button'; m.className='ghost'; m.textContent=L('Modifier','Modificar'); m.onclick=()=>open(e);
      const x=document.createElement('button'); x.type='button'; x.className='ghost danger'; x.textContent=L('Supprimer','Eliminar'); let c=false; x.onclick=async()=>{ if(!c){ c=true; x.textContent=L('Confirmer','Confirmar'); return; } await removeEntry(e); toast(L('Traitement supprimé.','Tratamiento eliminado.')); renderChauffe(); };
      act.append(m,x); d.appendChild(act); }
    el.appendChild(d); });

/* ---------- Graphiques réutilisés dans l'app et dans le registre (PDF) ----------

const PG_COLORS=['#7a2e3e','#2f6fc0','#1f7a45','#c27c0e','#6b4fa3','#0f8a8a','#b5466b','#5b6a61'];
function chartInk(print){ return print ? {text:'#555', strong:'#1b1b1b', grid:'#dcd5d6', bad:'#a3322a', zone:'#f1e4e7', bg:'#ffffff', in:'#1f7a45', ext:'#2f6fc0'}
  : {text:'var(--muted)', strong:'var(--fg)', grid:'var(--line)', bad:'var(--bad)', zone:'var(--accent-soft)', bg:'var(--surface)', in:'var(--s-in)', ext:'var(--s-ext)'}; }
function histoSVG(ch, print){
  const C=chartInk(print);
  const lots=lotsWithBilan(ch).filter(l=>bilanRate(l.b)!=null); if(!lots.length) return '';
  const pgs=[...new Set(lots.map(l=>l.pg||'?'))]; const col=k=>PG_COLORS[pgs.indexOf(k)%PG_COLORS.length];
  const mean=aggRate(lotsWithBilan(ch)).rate;
  const W=640, H=262, ml=36, mr=10, mt=32, mb=34, pw=W-ml-mr, ph=H-mt-mb, n=lots.length;
  const slot=pw/n, bw=Math.max(4,Math.min(46,slot*0.72));
  const Y=v=>mt+(1-v)*ph; const fs=n>30?8:n>20?9:10.5;
  let g=`<rect x="0" y="0" width="${W}" height="${H}" fill="${print?C.bg:'none'}"></rect>`;
  [0,0.25,0.5,0.75,1].forEach(v=>{ g+=`<line x1="${ml}" x2="${ml+pw}" y1="${Y(v)}" y2="${Y(v)}" stroke="${C.grid}" stroke-width="1"></line><text x="${ml-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="${C.text}" font-family="ui-monospace,Menlo,monospace">${v*100}%</text>`; });
  lots.forEach((l,i)=>{ const r=bilanRate(l.b), x=ml+i*slot+(slot-bw)/2, y=Y(r);
    g+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${(Y(0)-y).toFixed(1)}" rx="2" fill="${col(l.pg||'?')}"><title>${esc(L('Lot ','Lote ')+l.lot+' · '+[l.variete,l.pg].filter(Boolean).join(' / ')+' · '+pct(r))}</title></rect>`;
    if(slot>=14) g+=`<text x="${(x+bw/2).toFixed(1)}" y="${(y-4).toFixed(1)}" text-anchor="middle" font-size="${fs}" fill="${C.strong}" font-family="ui-monospace,Menlo,monospace">${Math.round(r*100)}</text>`;
    g+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-mb+14}" text-anchor="middle" font-size="${fs}" fill="${C.text}" font-family="ui-monospace,Menlo,monospace">${esc(l.lot)}</text>`; });
  if(mean!=null) g+=`<line x1="${ml}" x2="${ml+pw}" y1="${Y(mean)}" y2="${Y(mean)}" stroke="${C.strong}" stroke-width="1.4" stroke-dasharray="6 4"></line><line x1="${ml+pw-118}" x2="${ml+pw-96}" y1="10" y2="10" stroke="${C.strong}" stroke-width="1.4" stroke-dasharray="6 4"></line><text x="${ml+pw-2}" y="14" text-anchor="end" font-size="11.5" font-weight="700" fill="${C.strong}" font-family="system-ui,sans-serif">${esc(L('moyenne ','promedio ')+pct(mean))}</text>`;
  g+=`<text x="${ml}" y="${H-4}" font-size="10.5" fill="${C.text}" font-family="system-ui,sans-serif">${esc(L('N° de lot','N° de lote'))}</text>`;
  const leg=pgs.map(k=>`<span style="display:inline-flex;align-items:center;gap:5px;margin-right:12px"><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${col(k)}"></i>${esc(k)}</span>`).join('');
  return `<svg class="histo" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(L('Histogramme de la réussite par lot','Histograma del éxito por lote'))}" style="display:block;width:100%;height:auto">${g}</svg><div class="hleg" style="font-size:12.5px;color:${C.text};display:flex;flex-wrap:wrap;gap:4px 0">${esc(L('Porte-greffe : ','Portainjerto: '))}&nbsp;${leg}</div>`;
}
/* Vue d'ensemble : température, humidité et oxygène empilés sur le même axe des jours.
   Trait plein = dans le palox, pointillé = pièce. Moyenne par jour pour rester lisible. */
function comboData(ch){
  const D=ch.duree, days=[]; for(let j=1;j<=D;j++) days.push({j, tI:[],tE:[],hI:[],hE:[],oI:[],oE:[]});
  releves(ch.id).forEach(r=>{ const d=days[r.jour-1]; if(!d) return; const push=(k,v)=>{ if(v!=null) d[k].push(v); };
    push('tI',r.tInt); push('tE',r.tExt); push('hI',hIn(r)); push('hE',hOut(r)); push('oI',r.o2Int); push('oE',r.o2Ext); });
  const m=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length*10)/10:null;
  return days.map(d=>({j:d.j, tI:m(d.tI), tE:m(d.tE), hI:m(d.hI), hE:m(d.hE), oI:m(d.oI), oE:m(d.oE)}));
}
const CB_VARS=[

function tabBilan(ch, body){

  const groups=key=>{ const m={}; lots.forEach(l=>{ const k=l[key]||'?'; (m[k]=m[k]||[]).push(l); }); return Object.entries(m).map(([k,ls])=>({k, a:aggRate(ls)})).filter(x=>x.a.rate!=null).sort((a,b)=>b.a.rate-a.a.rate); };
  const grpHTML=(title,key)=>{ const g=groups(key); if(g.length<1) return ''; return `<div class="field"><span class="lab">${esc(title)}</span><div class="ratelist">${g.map(x=>`<div class="raterow"><span class="rk">${esc(x.k)}</span>${rateBar(x.a.rate)}<span class="rv mono">${pct(x.a.rate)}</span></div>`).join('')}</div></div>`; };
  body.innerHTML=`
    <p class="note">${esc(L("À la sortie de chauffe, trie un échantillon de chaque lot (ou le lot entier) et note combien de plants sont bons (1er et 2e choix), à remettre en chauffe ou en rebut. Ensuite, suis l'acclimatation dans l'onglet Acclim. L'app calcule la réussite de chaque lot et la compare d'une saison à l'autre (Accueil → Comparer les saisons).","Al salir de la calefacción, revisa una muestra de cada lote (o el lote entero) y anota cuántas plantas están buenas (1ª y 2ª), a recalentar o descartadas. Después, sigue la aclimatación en la pestaña Aclim. La app calcula el éxito de cada lote y lo compara de una temporada a otra (Inicio → Comparar temporadas)."))}</p>
    <div class="card">
      <div class="hhead"><h3>${esc(L('Réussite de la chauffe','Éxito de la calefacción'))}</h3><span class="mono">${esc(plural(done,'lot','lots','lote','lotes'))} / ${lots.length}</span></div>
      <div class="bigrate">${pct(agg.rate)}</div>
      <p class="note">${agg.rate==null?esc(L('Pas encore de bilan : touche un lot ci-dessous pour le saisir.','Todavía no hay balance: toca un lote abajo para ingresarlo.')):esc(L('Moyenne pondérée par la taille des lots.','Promedio ponderado por el tamaño de los lotes.')+(agg.tries?' '+plural(agg.tries,'plant trié','plants triés','planta revisada','plantas revisadas')+', '+plural(agg.bons,'bon','bons','buena','buenas')+'.':''))}</p>
      ${grpHTML(L('Par porte-greffe','Por portainjerto'),'pg')}
      ${grpHTML(L('Par variété','Por variedad'),'variete')}
      <div class="field"><label for="b-date">${esc(L('Date de sortie de chauffe','Fecha de salida de la calefacción'))}</label><input id="b-date" type="date" value="${esc(ch.sortie||'')}"></div>
    </div>
    ${done?`<div class="card" style="gap:10px"><h3>${esc(L('Réussite par lot','Éxito por lote'))}</h3>${histoSVG(ch,false)}<p class="note">${esc(L('Chaque barre est un lot, colorée selon son porte-greffe. Le trait pointillé est la moyenne de la chauffe.','Cada barra es un lote, coloreada según su portainjerto. La línea punteada es el promedio de la calefacción.'))}</p></div>`:''}
    <div class="list" id="b-list"></div>
    <div class="card" style="gap:10px">
      <span class="lab">${esc(L('Ajouter un lot qui n\'est pas dans la liste','Agregar un lote que no está en la lista'))}</span>
      <div class="three"><div class="field"><label for="b-nl">${esc(L('N° du lot','N° de lote'))}</label><input id="b-nl" type="text" inputmode="numeric"></div><div class="field"><label for="b-nv">${esc(L('Variété','Variedad'))}</label><input id="b-nv" type="text"></div><div class="field"><label for="b-np">${esc(L('Porte-greffe','Portainjerto'))}</label><input id="b-np" type="text"></div></div>
      <button class="ghost" type="button" id="b-add">${esc(L('+ Saisir le bilan de ce lot','+ Ingresar el balance de este lote'))}</button>
    </div>`;
  $('b-date').onchange=async()=>{ await saveChauffe(Object.assign({},ch,{sortie:$('b-date').value||''})); toast(L('Date de sortie enregistrée.','Fecha de salida guardada.')); };
  $('b-add').onclick=()=>{ const lot=$('b-nl').value.trim(); if(!lot){ $('b-nl').focus(); return; } S.bilanEdit={chId:ch.id, lot, variete:$('b-nv').value.trim(), pg:$('b-np').value.trim()}; renderChauffe(); setTimeout(()=>{ const f=$('be-pctbox')&&!$('be-pctbox').hidden?$('be-pct'):$('be-tries'); if(f){ f.scrollIntoView({block:'center'}); f.focus(); } },30); };
  const el=$('b-list');
  const editing=S.bilanEdit && S.bilanEdit.chId===ch.id ? S.bilanEdit : null;
  const all=lots.slice(); if(editing && !all.some(l=>l.lot===String(editing.lot))) all.push({lot:String(editing.lot), variete:editing.variete, pg:editing.pg, qte:null, b:null});
  if(!all.length){ el.innerHTML=`<div class="item empty">${esc(L('Aucun lot dans cette chauffe. Ajoute les lots dans Infos → Modifier, ou saisis un lot ci-dessous.','Ningún lote en esta calefacción. Agrega los lotes en Infos → Modificar, o ingresa un lote abajo.'))}</div>`; return; }
  all.forEach(l=>{ const d=document.createElement('div'); d.className='item'; const r=bilanRate(l.b);
    const head=`<div class="hhead"><span class="d">${esc(L('Lot ','Lote ')+l.lot)}${l.variete||l.pg?' · '+esc([l.variete,l.pg].filter(Boolean).join(' / ')):''}</span><span class="mono">${l.qte?esc(fmtN(l.qte))+' pl.':''}</span></div>`;
    if(editing && String(editing.lot)===l.lot){
      const b=l.b||{};
      d.classList.add('editing');
      const mode0 = isPctBilan(l.b) ? 'pct' : (l.b ? 'compte' : (S.bilanMode||'compte'));
      d.innerHTML=head+`<div class="field"><span class="lab">${esc(L('Comment saisir ?','¿Cómo ingresar?'))}</span><div class="seg" id="be-mode"><button type="button" data-v="compte" aria-pressed="${mode0==='compte'}">${esc(L('Compter les plants','Contar las plantas'))}</button><button type="button" data-v="pct" aria-pressed="${mode0==='pct'}">${esc(L('Pourcentage direct','Porcentaje directo'))}</button></div></div>
        <div id="be-pctbox"${mode0==='pct'?'':' hidden'} class="field"><label for="be-pct">${esc(L('Réussite (%)','Éxito (%)'))}</label><input id="be-pct" class="num" type="text" inputmode="decimal" value="${isPctBilan(b)?esc(fmtN(b.pct)):''}" placeholder="%"><span class="ex">${esc(L('Ex. : 92 ou 87,5. Pratique si le chef de culture te donne directement le pourcentage.','Ej.: 92 u 87,5. Útil si el jefe de cultivo te da directamente el porcentaje.'))}</span></div>
        <div id="be-cntbox"${mode0==='pct'?' hidden':''} class="field"><div class="two"><div class="field"><label for="be-tries">${esc(L('Plants triés','Plantas revisadas'))}</label><input id="be-tries" class="num" type="text" inputmode="numeric" value="${b.tries!=null?b.tries:''}" placeholder="N°"></div><div class="field"><label for="be-bons">${esc(L('Bons (1er choix)','Buenas (1ª)'))}</label><input id="be-bons" class="num" type="text" inputmode="numeric" value="${b.bons!=null?b.bons:''}" placeholder="N°"></div></div>
        <div class="two"><div class="field"><label for="be-c2">${esc(L('2e choix','2ª selección'))} <span class="hint">${esc(L('(facultatif)','(opcional)'))}</span></label><input id="be-c2" class="num" type="text" inputmode="numeric" value="${b.c2?b.c2:''}" placeholder="N°"></div><div class="field"><label for="be-rech">${esc(L('À remettre en chauffe','A recalentar'))} <span class="hint">${esc(L('(facultatif)','(opcional)'))}</span></label><input id="be-rech" class="num" type="text" inputmode="numeric" value="${b.rech?b.rech:''}" placeholder="N°"></div></div>
        <span class="ex">${esc(L("Ex. : 200 triés, 170 en 1er choix, 14 en 2e choix, 4 à remettre en chauffe → 92 % de réussite, 12 rebuts. Un échantillon suffit.","Ej.: 200 revisadas, 170 de 1ª, 14 de 2ª, 4 a recalentar → 92 % de éxito, 12 descartes. Basta con una muestra."))}</span>
        <div class="sumbox" id="be-calc"></div></div>
        <div class="field"><span class="lab">${esc(L('Cause principale des rebuts','Causa principal de los descartes'))} <span class="hint">${esc(L('(facultatif)','(opcional)'))}</span></span><div class="seg" id="be-cause">${CAUSES.map(c=>`<button type="button" data-v="${esc(c)}" aria-pressed="${b.cause===c}">${esc(T(c))}</button>`).join('')}</div></div>
        <div class="field"><label for="be-dtri">${esc(L('Date du tri','Fecha de la selección'))}</label><input id="be-dtri" type="date" value="${esc(b.dateTri||ch.sortie||new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10))}"></div>
        <div class="field"><label for="be-rem">${esc(L('Remarques','Observaciones'))}</label><input id="be-rem" type="text" value="${esc(b.remarque||'')}"></div>
        <div class="row"><button class="primary" type="button" id="be-ok">${esc(L('Enregistrer le bilan','Guardar el balance'))}</button><button class="ghost" type="button" id="be-x">${esc(L('Annuler','Cancelar'))}</button></div>
        ${l.b?`<button class="ghost danger" type="button" id="be-del">${esc(L('Supprimer ce bilan','Eliminar este balance'))}</button>`:''}
        <div class="status" id="be-st"></div>`;
      el.appendChild(d);
      let cause=b.cause||'';
      $('be-cause').querySelectorAll('button').forEach(x=>x.onclick=()=>{ cause=cause===x.dataset.v?'':x.dataset.v; $('be-cause').querySelectorAll('button').forEach(y=>y.setAttribute('aria-pressed',y.dataset.v===cause)); });
      const calc=()=>{ const t=num($('be-tries').value), g=num($('be-bons').value), c2=num($('be-c2').value)||0, rh=num($('be-rech').value)||0; const c=$('be-calc');
        c.innerHTML = t>0 && g!=null && g+c2+rh<=t ? `<b>${pct((g+c2)/t)}</b> ${esc(L('de réussite','de éxito'))} · ${esc(plural(t-g-c2-rh,'rebut','rebuts','descarte','descartes'))}${rh?' · '+esc(fmtN(rh)+L(' à remettre en chauffe',' a recalentar')):''}` : ''; };
      ['be-tries','be-bons','be-c2','be-rech'].forEach(id=>$(id).oninput=calc); calc();
      let mode=mode0;
      $('be-mode').querySelectorAll('button').forEach(x=>x.onclick=()=>{ mode=x.dataset.v; S.bilanMode=mode; $('be-mode').querySelectorAll('button').forEach(y=>y.setAttribute('aria-pressed',y===x)); $('be-pctbox').hidden=mode!=='pct'; $('be-cntbox').hidden=mode==='pct'; $('be-st').textContent=''; const f=$(mode==='pct'?'be-pct':'be-tries'); if(f) f.focus(); });
      $('be-x').onclick=()=>{ S.bilanEdit=null; renderChauffe(); };
      if($('be-del')){ let c=false; $('be-del').onclick=async()=>{ if(!c){ c=true; $('be-del').textContent=L('Toucher encore pour supprimer','Tocar otra vez para eliminar'); return; } await removeEntry(l.b); S.bilanEdit=null; toast(L('Bilan supprimé.','Balance eliminado.')); renderChauffe(); }; }
      $('be-ok').onclick=async()=>{ const t=num($('be-tries').value), g=num($('be-bons').value), stEl=$('be-st');
        const base=()=>Object.assign({}, l.b||{id:'bilan:'+ch.id+':'+l.lot, type:'bilan', chauffeId:ch.id, lot:l.lot, creeLe:nowIso()}, {jour:ch.duree, variete:l.variete, pg:l.pg, cause, dateTri:$('be-dtri').value||'', remarque:$('be-rem').value.trim(), auteurId:S.me.id, auteurNom:S.me.nom});
        if(mode==='pct'){ const pv=num($('be-pct').value);
          if(pv==null||pv<0||pv>100){ stEl.textContent=L('Indique un pourcentage entre 0 et 100.','Indica un porcentaje entre 0 y 100.'); stEl.className='status err'; return; }
          const ent=Object.assign(base(),{pct:Math.round(pv*10)/10, tries:null, bons:null, c2:null, rech:null}); delete ent.supprime; await saveEntry(ent); S.bilanEdit=null;
          toast(L('Bilan du lot ','Balance del lote ')+l.lot+L(' enregistré : ',' guardado: ')+pct(bilanRate(ent))+'.'); renderChauffe(); return; }
        if(!(t>0)){ stEl.textContent=L('Indique le nombre de plants triés.','Indica el número de plantas revisadas.'); stEl.className='status err'; return; }
        if(g==null||g<0){ stEl.textContent=L('Indique le nombre de plants bons.','Indica el número de plantas buenas.'); stEl.className='status err'; return; }
        const c2=num($('be-c2').value)||0, rh=num($('be-rech').value)||0;
        if(c2<0||rh<0||g+c2+rh>t){ stEl.textContent=L('1er choix + 2e choix + à remettre en chauffe ne peut pas dépasser le nombre de plants triés.','1ª + 2ª + a recalentar no puede superar el número de plantas revisadas.'); stEl.className='status err'; return; }
        const ent=Object.assign(base(),{tries:Math.round(t), bons:Math.round(g), c2:Math.round(c2), rech:Math.round(rh), pct:null});
        delete ent.supprime; await saveEntry(ent); S.bilanEdit=null; toast(L('Bilan du lot ','Balance del lote ')+l.lot+L(' enregistré : ',' guardado: ')+pct(bilanRate(ent))+'.'); renderChauffe(); };
      return;
    }
    d.innerHTML=head+(l.b?`<div class="raterow">${rateBar(r)}<span class="rv mono">${pct(r)}</span></div><div class="rem">${esc(bilanDetail(l.b))}${l.b.cause?' · '+esc(L('cause : ','causa: ')+T(l.b.cause)):''}${l.b.remarque?' · '+esc(l.b.remarque):''}</div><div class="who">${esc(authorName(l.b))}</div>`:`<div class="rem">${esc(L('Bilan pas encore saisi.','Balance aún no ingresado.'))}</div>`);
    const btn=document.createElement('button'); btn.type='button'; btn.className='ghost'; btn.textContent=l.b?L('Modifier le bilan','Modificar el balance'):L('Saisir le bilan','Ingresar el balance');
    btn.onclick=()=>{ S.bilanEdit={chId:ch.id, lot:l.lot, variete:l.variete, pg:l.pg}; renderChauffe(); setTimeout(()=>{ const f=$('be-pctbox')&&!$('be-pctbox').hidden?$('be-pct'):$('be-tries'); if(f){ f.scrollIntoView({block:'center'}); f.focus(); } },30); };
    d.appendChild(btn); el.appendChild(d); });
}

/* ---------- 3. Comparer les saisons ---------- */
const CMP_COLORS=['#7a2e3e','#2f6fc0','#1f7a45','#c27c0e','#6b4fa3','#0f8a8a','#b5466b','#5b6a61'];
function renderCompare(){
  const all=S.chauffes.filter(c=>!c.supprime).sort((a,b)=>(a.debut||a.creeLe||'').localeCompare(b.debut||b.creeLe||''));
  const color={}; all.forEach((c,i)=>color[c.id]=CMP_COLORS[i%CMP_COLORS.length]);
  const sel=all.filter(c=>!S.cmpOff[c.id]);
  S.cmpBy=S.cmpBy||'combo';
  app.innerHTML=`<header class="top"><div class="title-row"><div class="left"><button class="back" id="k-back" type="button" aria-label="Retour">‹</button><h1>${esc(L('Comparer les saisons','Comparar temporadas'))}</h1></div></div></header>
  <section class="panel">
    ${all.length?`<div class="field"><span class="lab">${esc(L('Chauffes comparées','Calefacciones comparadas'))}</span><div class="seg" id="k-sel">${all.map(c=>`<button type="button" data-id="${esc(c.id)}" aria-pressed="${!S.cmpOff[c.id]}"><i class="sw" style="background:${color[c.id]}"></i>${esc(c.nom)}</button>`).join('')}</div></div>`:''}
    <div id="k-body"></div>
  </section>`;
  $('k-back').onclick=()=>go('home');
  app.querySelectorAll('#k-sel button').forEach(b=>b.onclick=()=>{ S.cmpOff[b.dataset.id]=!S.cmpOff[b.dataset.id]; renderCompare(); });
  const body=$('k-body');
  if(!sel.length){ body.innerHTML=`<div class="item empty">${esc(all.length?L('Sélectionne au moins une chauffe.','Selecciona al menos una calefacción.'):L('Aucune chauffe pour l\'instant.','Ninguna calefacción por ahora.'))}</div>`; return; }
  // Vue d'ensemble
  const rowsH=sel.map(c=>{ const ds=dayStats(c); const ins=[].concat(...ds.map(d=>d.ins)); const mean=ins.length?ins.reduce((x,y)=>x+y,0)/ins.length:null;
    const tq=(c.lots||[]).reduce((s,l)=>s+(l.qte||0),0); const r=chauffeRate(c); const obsAl=entriesOf(c.id).filter(e=>(e.type==='obs'||e.type==='lot')&&alertsOf(e).length).length;
    return `<tr><td><i class="sw" style="background:${color[c.id]}"></i>${esc(c.nom)}</td><td class="mono">${c.debut?esc(c.debut.split('-').reverse().join('/')):'—'}</td><td class="mono">${c.duree} ${L('j','d')}</td><td class="mono">${(c.lots||[]).length}${tq?' · '+esc(fmtN(tq)):''}</td><td class="mono">${mean!=null?fmtN(Math.round(mean*10)/10)+' °C':'—'}</td><td class="mono">${ins.length?fmtN(Math.min(...ins))+'–'+fmtN(Math.max(...ins))+' °C':'—'}</td><td class="mono">${hasSeuils(c)?ds.filter(d=>d.alert).length:'—'}</td><td class="mono">${obsAl}</td><td class="mono"><b>${pct(r.rate)}</b></td></tr>`; }).join('');
  body.innerHTML=`<div class="card" style="gap:10px"><h3>${esc(L('Vue d\'ensemble','Resumen'))}</h3>
      <div class="scrollx"><table class="lotsTable cmp"><thead><tr><th>${esc(L('Chauffe','Calefacción'))}</th><th>${esc(L('Début','Inicio'))}</th><th>${esc(L('Durée','Duración'))}</th><th>${esc(L('Lots · plants','Lotes · plantas'))}</th><th>${esc(L('T° moy. palox','T° prom. palox'))}</th><th>${esc(L('Min–max','Mín–máx'))}</th><th>${esc(L('Jours hors seuils','Días fuera de umbral'))}</th><th>${esc(L('Alertes obs.','Alertas obs.'))}</th><th>${esc(L('Réussite','Éxito'))}</th></tr></thead><tbody>${rowsH}</tbody></table></div>
      <p class="note">${esc(L('« Jours hors seuils » ne compte que les chauffes qui ont des seuils. La réussite vient de l\'onglet Bilan.','« Días fuera de umbral » solo cuenta las calefacciones que tienen umbrales. El éxito viene de la pestaña Balance.'))}</p></div>
    <div class="card" style="gap:10px"><h3>${esc(L('Température moyenne dans les palox, jour par jour','Temperatura promedio en los palox, día por día'))}</h3>
      <div class="legend">${sel.map(c=>`<span><i class="sw" style="background:${color[c.id]}"></i>${esc(c.nom)}</span>`).join('')}</div>
      <svg id="k-chart" class="kchart" role="img" aria-label="${esc(L('Températures moyennes comparées','Temperaturas promedio comparadas'))}"></svg>
      <div class="tip" id="k-tip">${esc(L('Touche un point pour voir sa valeur.','Toca un punto para ver su valor.'))}</div></div>
    <div class="card" style="gap:10px"><h3>${esc(L('Réussite par lot de plants','Éxito por tipo de planta'))}</h3>
      <div class="seg" id="k-by"><button type="button" data-v="combo" aria-pressed="${S.cmpBy==='combo'}">${esc(L('Variété × porte-greffe','Variedad × portainjerto'))}</button><button type="button" data-v="pg" aria-pressed="${S.cmpBy==='pg'}">${esc(L('Porte-greffe','Portainjerto'))}</button><button type="button" data-v="variete" aria-pressed="${S.cmpBy==='variete'}">${esc(L('Variété','Variedad'))}</button></div>
      <div id="k-mx"></div></div>`;
  $('k-by').querySelectorAll('button').forEach(b=>b.onclick=()=>{ S.cmpBy=b.dataset.v; renderCompare(); });
  // Courbes
  const D=Math.max(...sel.map(c=>c.duree)); const series=sel.map(c=>({c, pts:dayStats(c).filter(d=>d.inMean!=null).map(d=>({j:d.j, v:d.inMean}))}));
  const vals=[].concat(...series.map(s=>s.pts.map(p=>p.v)));
  const W=640,H=250,ml=34,mr=14,mt=14,mb=30,pw=W-ml-mr,ph=H-mt-mb;
  let lo=vals.length?Math.floor((Math.min(...vals)-2)/5)*5:10, hi=vals.length?Math.ceil((Math.max(...vals)+2)/5)*5:35; if(hi-lo<10) hi=lo+10;
  const X=j=>ml+(j-0.5)/D*pw, Y=v=>mt+(hi-v)/(hi-lo)*ph; let g='';
  for(let v=lo;v<=hi;v+=5) g+=`<line class="grid" x1="${ml}" x2="${ml+pw}" y1="${Y(v)}" y2="${Y(v)}"></line><text x="${ml-6}" y="${Y(v)+4}" text-anchor="end">${v}°</text>`;
  const step=Math.max(1,Math.ceil(D/8)); for(let j=1;j<=D;j+=step) g+=`<text x="${X(j)}" y="${H-8}" text-anchor="middle">J${j}</text>`;
  const hits=[];
  series.forEach(s=>{ if(s.pts.length>1) g+=`<polyline fill="none" stroke="${color[s.c.id]}" stroke-width="2.2" stroke-linejoin="round" points="${s.pts.map(p=>X(p.j).toFixed(1)+','+Y(p.v).toFixed(1)).join(' ')}"></polyline>`;
    s.pts.forEach(p=>{ g+=`<circle cx="${X(p.j).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3.5" fill="${color[s.c.id]}" stroke="var(--surface)" stroke-width="1.5"></circle>`; hits.push({s,p}); }); });
  hits.forEach((h,i)=>{ g+=`<circle class="hit" data-i="${i}" cx="${X(h.p.j).toFixed(1)}" cy="${Y(h.p.v).toFixed(1)}" r="11"></circle>`; });
  if(!vals.length) g+=`<text x="${ml+pw/2}" y="${mt+ph/2}" text-anchor="middle">${esc(L('Pas encore de relevés dans les palox','Aún no hay lecturas en los palox'))}</text>`;
  const svg=$('k-chart'); svg.setAttribute('viewBox',`0 0 ${W} ${H}`); svg.innerHTML=g;
  svg.querySelectorAll('.hit').forEach(c=>c.onclick=()=>{ const h=hits[Number(c.dataset.i)]; $('k-tip').innerHTML='<b>'+esc(fmtN(Math.round(h.p.v*10)/10))+' °C</b> · '+esc(h.s.c.nom)+' · J'+h.p.j+(h.s.c.debut?' ('+esc(dayShort(h.s.c,h.p.j))+')':''); });
  // Matrice de réussite
  const keyOf=l=>S.cmpBy==='pg'?(l.pg||'?'):S.cmpBy==='variete'?(l.variete||'?'):((l.variete||'?')+' / '+(l.pg||'?'));
  const cells={}, keys={};
  sel.forEach(c=>lotsWithBilan(c).forEach(l=>{ if(bilanRate(l.b)==null) return; const k=keyOf(l); keys[k]=keys[k]||[]; keys[k].push(l); (cells[k+'|'+c.id]=cells[k+'|'+c.id]||[]).push(l); }));
  const ks=Object.keys(keys).sort((a,b)=>(aggRate(keys[b]).plants||aggRate(keys[b]).tries)-(aggRate(keys[a]).plants||aggRate(keys[a]).tries));
  const mx=$('k-mx');

function thSVG(series,o,print,small,scaleSeries){

  let lo=Math.min(...vals), hi=Math.max(...vals); if(hi-lo<4){ lo-=2; hi+=2; }
  const step=[1,2,5,10,20,25].find(s=>(hi-lo)/s<=(small?4:6))||50; lo=Math.floor(lo/step)*step; hi=Math.ceil(hi/step)*step;
  const D=o.D, W=640, H=small?150:220, ml=40, mr=40, mt=12, mb=26, pw=W-ml-mr, ph=H-mt-mb;
  const X=t=>ml+t/D*pw, Y=v=>mt+(hi-v)/((hi-lo)||1)*ph; const mono='font-family="ui-monospace,Menlo,monospace"';
  let g=`<rect x="0" y="0" width="${W}" height="${H}" fill="${print?C.bg:'none'}"></rect>`;
  for(let v=lo;v<=hi+1e-9;v+=step) g+=`<line x1="${ml}" x2="${ml+pw}" y1="${Y(v)}" y2="${Y(v)}" stroke="${C.grid}"></line><text x="${ml-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="${C.text}" ${mono}>${fmtN(v)}</text>`;
  const st=Math.max(1,Math.ceil(D/10)); for(let j=1;j<=D;j+=st) g+=`<text x="${X(j-0.5)}" y="${H-7}" text-anchor="middle" font-size="11" fill="${C.text}" ${mono}>${o.pre}${j}</text>`;
  lines.forEach(([v,lab])=>{ g+=`<line x1="${ml}" x2="${ml+pw}" y1="${Y(v)}" y2="${Y(v)}" stroke="${C.bad}" stroke-width="1.2" stroke-dasharray="5 4"></line><text x="${ml+pw+4}" y="${Y(v)+4}" font-size="10" fill="${C.bad}" font-family="system-ui,sans-serif">${esc(lab)}</text>`; });
  series.forEach(se=>{ const pts=se.pts; if(!pts.length) return;
    if(pts.length>1) g+=`<polyline fill="none" stroke="${se.col}" stroke-width="1.8" stroke-linejoin="round" points="${pts.map(p=>X(p.x).toFixed(1)+','+Y(p.v).toFixed(1)).join(' ')}"></polyline>`;

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(L('Courbes par thermomètre','Curvas por termómetro'))}" style="display:block;width:100%;height:auto">${g}</svg>`; }

const P_COMMON=[{k:'heures', t:'num', fr:'Heures de travail', es:'Horas de trabajo'},{k:'cout', t:'num', fr:'Coût (produits, énergie…)', es:'Costo (productos, energía…)', money:true},{k:'remarque', t:'area', fr:'Remarques', es:'Observaciones'}];
const stageDef = k => P_STAGES.find(s=>s.k===k);
const sName = s => L(s.fr,s.es);

/* Valeur d'une étape pour le rendement (somme si plusieurs fiches). */
function stageCount(lotId, k){ const s=stageDef(k); if(!s||!s.count) return null; const recs=pStep(lotId,k); if(!recs.length) return null;
  let t=0, any=false; recs.forEach(r=>{ const v= s.count==='vend' ? ((r.cat1||0)+(r.cat2||0)) : r[s.count]; if(v!=null&&(s.count!=='vend'||r.cat1!=null||r.cat2!=null)){ t+=v; any=true; } }); return any?t:null; }
const livres = lotId => pAll('p_cmd').filter(c=>c.lotId===lotId && c.statut==='Livrée').reduce((a,c)=>a+(c.qte||0),0);
/* Entonnoir de rendement d'un lot (ou d'un ensemble de lots). */
const FUNNEL=[['greffage'],['sortie'],['plantation'],['reprise'],['arrachage'],['tri'],['vendus']];
function funnelOf(lots){
  const rows=FUNNEL.map(([k])=>{ const per={};
    if(k==='vendus'){ lots.forEach(l=>{ const x=livres(l.id); if(x>0) per[l.id]=x; }); }
    else lots.forEach(l=>{ const c=stageCount(l.id,k); if(c!=null) per[l.id]=c; });
    const ids=Object.keys(per); const s=stageDef(k);
    return {k, lab:k==='vendus'?L('Vendus (livrés)','Vendidas (entregadas)'):L(s.cl[0],s.cl[1]), v:ids.reduce((a,i)=>a+per[i],0), any:ids.length>0, n:ids.length, per}; });
  return rows;
}
/* Suggestion pour la sortie de chauffe : greffés × réussite du bilan de la chauffe liée. */
function sortieSuggest(lotId){
  const g=stageCount(lotId,'greffage'); const pal=pStep(lotId,'palox')[0]; if(!pal||!pal.chauffe) return null;
  const ch=S.chauffes.find(c=>c.id===pal.chauffe&&!c.supprime); if(!ch) return null; const lot=pLot(lotId);
  const b=bilanOf(ch.id, pal.lotCh||lot.numero); const r=bilanRate(b); if(r==null) return {ch, r:null};
  return {ch, r, v:g!=null?Math.round(g*r):null};
}

  if(f.t==='chauffe') return `<div class="field"><label for="${id}">${lab}</label><select id="${id}"><option value="">${esc(L('— aucune —','— ninguna —'))}</option>${S.chauffes.filter(c=>!c.supprime).map(c=>`<option value="${esc(c.id)}"${c.id===v?' selected':''}>${esc(c.nom)}</option>`).join('')}</select></div>`;
  if(f.t==='parc'){ const ps=pAll('p_parc').filter(p=>!f.ptype||p.ptype===f.ptype); return `<div class="field"><label for="${id}">${lab}</label><select id="${id}"><option value="">${esc(L('— aucune —','— ninguna —'))}</option>${ps.map(p=>`<option value="${esc(p.id)}"${p.id===v?' selected':''}>${esc(p.nom)}</option>`).join('')}</select>${ps.length?'':`<span class="ex">${esc(L('Ajoute tes parcelles dans Production → Parcelles.','Agrega tus parcelas en Producción → Parcelas.'))}</span>`}</div>`; }
  return `<div class="field"><label for="${id}">${lab}</label><input id="${id}" type="text" value="${esc(v||'')}" placeholder="${esc(f.ph||'')}"></div>`;

function pBindSegs(defs, idp){ defs.filter(f=>f.t==='seg').forEach(f=>{ const el=$(idp+f.k); if(!el) return; el.querySelectorAll('button').forEach(b=>b.onclick=()=>{ const nv=el.dataset.v===b.dataset.v?'':b.dataset.v; el.dataset.v=nv; el.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===nv)); }); }); }
function pRead(defs, idp){ const o={}; for(const f of defs){ const el=$(idp+f.k); if(!el||f.t==='info') continue;
    if(f.t==='num'){ const t=el.value.trim(); const v=num(t); if(t&&v==null) return {err:L('Nombre illisible : ','Número ilegible: ')+L(f.fr,f.es)}; if(f.req&&v==null) return {err:L('À remplir : ','Falta completar: ')+L(f.fr,f.es)}; o[f.k]=v; }
    else if(f.t==='bool') o[f.k]=el.checked; else if(f.t==='seg') o[f.k]=el.dataset.v||''; else o[f.k]=el.value.trim(); }
  return o; }
function pSummary(defs, r){ return defs.filter(f=>f.t!=='info'&&f.k!=='remarque'&&r[f.k]!=null&&r[f.k]!==''&&r[f.k]!==false).map(f=>{ let v=r[f.k];
    if(f.t==='date') v=pdate(v); else if(f.t==='num') v=f.money?money(v):fmtN(v); else if(f.t==='bool') v=L('oui','sí'); else if(f.t==='seg'){ const o=f.opts.find(o=>o[0]===v); v=o?L(o[0],o[1]):v; }
    else if(f.t==='chauffe'){ const c=S.chauffes.find(x=>x.id===v); v=c?c.nom:'?'; } else if(f.t==='parc'){ const p=pAll('p_parc').find(x=>x.id===v); v=p?p.nom:'?'; }
    return L(f.fr,f.es)+' : '+v; }); }

/* ---------- Écran Production (saison) ---------- */
function funnelHTML(rows){
  const base=rows.find(r=>r.any&&r.v>0); if(!base) return `<p class="note">${esc(L('Le rendement apparaît dès que tu saisis le nombre de greffes, puis les étapes suivantes.','El rendimiento aparece cuando ingresas el número de injertos y luego las etapas siguientes.'))}</p>`;
  /* Perte entre deux étapes : calculée seulement sur les lots qui ont les deux valeurs. */
  const pairLoss=(a,b)=>{ let x=0,y=0,n=0; Object.keys(b.per).forEach(id=>{ if(a.per[id]!=null){ x+=a.per[id]; y+=b.per[id]; n++; } }); return x?{loss:1-y/x,n}:null; };
  const many=Math.max(...rows.map(r=>r.n))>1;
  let prev=null; return `<div class="funnel">${rows.map(r=>{ if(!r.any){ return `<div class="frow off"><span class="fl">${esc(r.lab)}</span><span class="fb"></span><span class="fv mono">—</span></div>`; }
    const w=Math.max(2,Math.min(100,r.v/base.v*100)); const pl=prev?pairLoss(prev,r):null; prev=r;

/* ---------- Planifier à rebours ---------- */
function histRates(variete, pg){
  const match=l=>(!variete||(l.variete||'').toUpperCase()===variete.toUpperCase())&&(!pg||(l.pg||'').toUpperCase()===pg.toUpperCase());
  const step=(lots,a,b)=>{ let x=0,y=0; lots.forEach(l=>{ const ca=stageCount(l.id,a), cb=stageCount(l.id,b); if(ca&&cb!=null){ x+=ca; y+=cb; } }); return x?{r:y/x, n:x}:null; };
  const pick=(a,b)=>step(pLots().filter(match),a,b)||step(pLots(),a,b);
  return {chauffe:pick('greffage','sortie'), plant:pick('sortie','plantation'), reprise:pick('plantation','reprise'), arr:pick('reprise','arrachage'), tri:pick('arrachage','tri')};
}
function renderPlan(){
  const P=S.planIn||(S.planIn={variete:'',pg:'',cible:'',casse:'5'});
  const H=histRates(P.variete,P.pg);
  const DEF={chauffe:0.85, plant:0.98, reprise:0.85, arr:0.98, tri:0.9};
  const LAB={chauffe:['Sortie de chauffe (bons / greffés)','Salida de calefacción (buenas / injertadas)'], plant:['Plantés / bons','Plantadas / buenas'], reprise:['Reprise en pépinière','Prendimiento en vivero'], arr:['Arrachés / repris','Arrancadas / prendidas'], tri:['Vendables / arrachés','Vendibles / arrancadas']};
  const rate=k=>{ const ov=P['r_'+k]; if(ov!=null&&ov!=='') return num(ov)/100; return H[k]?H[k].r:DEF[k]; };
  const cible=num(P.cible); const ks=Object.keys(DEF); const glob=ks.reduce((a,k)=>a*rate(k),1);
  const greffes=cible&&glob?Math.ceil(cible/glob):null; const casse=(num(P.casse)||0)/100;
  const plantes=cible?Math.ceil(cible/(rate('tri')*rate('arr')*rate('reprise'))):null;
  const pxSize=(()=>{ let p=0,n=0; S.chauffes.forEach(c=>(c.lots||[]).forEach(l=>{ if(l.qte&&l.palox){ p+=l.qte; n+=l.palox; } })); return n?p/n:null; })();
  app.innerHTML=`<header class="top"><div class="title-row"><div class="left"><button class="back" id="pn-back" type="button" aria-label="Retour">‹</button><h1>${esc(L('Planifier','Planificar'))}</h1></div></div></header>
  <section class="panel">
    <p class="note">${esc(L("Pars du nombre de plants à vendre : l'app calcule combien greffer, en utilisant tes rendements passés (ou des valeurs par défaut à remplacer par les tiennes).","Parte del número de plantas a vender: la app calcula cuántas injertar, usando tus rendimientos pasados (o valores por defecto a reemplazar por los tuyos)."))}</p>
    <div class="card">
      <div class="two"><div class="field"><label for="pn-v">${esc(L('Variété','Variedad'))}</label><input id="pn-v" type="text" value="${esc(P.variete)}" placeholder="Ex. : SAU"></div><div class="field"><label for="pn-p">${esc(L('Porte-greffe','Portainjerto'))}</label><input id="pn-p" type="text" value="${esc(P.pg)}" placeholder="Ex. : SO4"></div></div>
      <div class="two"><div class="field"><label for="pn-c">${esc(L('Plants vendables voulus','Plantas vendibles deseadas'))}</label><input id="pn-c" class="num" type="text" inputmode="numeric" value="${esc(P.cible)}" placeholder="N°"></div><div class="field"><label for="pn-k">${esc(L('Casse au greffage (%)','Quiebre en injerto (%)'))}</label><input id="pn-k" class="num" type="text" inputmode="decimal" value="${esc(P.casse)}"></div></div>
      <span class="lab">${esc(L('Taux utilisés','Tasas utilizadas'))}</span>
      ${ks.map(k=>`<div class="planrow"><span>${esc(L(LAB[k][0],LAB[k][1]))}<br><span class="hint">${H[k]?esc(L('historique : ','histórico: ')+pct(H[k].r)+' ('+L('sur ','sobre ')+fmtN(H[k].n)+')'):esc(L('par défaut','por defecto'))}</span></span><input class="num" type="text" inputmode="decimal" data-r="${k}" value="${esc(P['r_'+k]??'')}" placeholder="${Math.round(rate(k)*1000)/10}"><span class="hint">%</span></div>`).join('')}
    </div>
    <div class="card" style="gap:8px"><h3>${esc(L('Résultat','Resultado'))}</h3>
      ${greffes?`<div class="bigrate">${esc(fmtN(greffes))}</div><p class="note">${esc(L('greffes à réaliser','injertos a realizar'))} · ${esc(L('rendement global ','rendimiento global ')+pct(glob))}</p>
      <dl class="kv"><dt>${esc(L('Greffons','Púas'))}</dt><dd>${esc(fmtN(Math.ceil(greffes*(1+casse))))}</dd><dt>${esc(L('Porte-greffes','Portainjertos'))}</dt><dd>${esc(fmtN(Math.ceil(greffes*(1+casse))))}</dd>${pxSize?`<dt>Palox</dt><dd>≈ ${esc(fmtN(Math.ceil(greffes/pxSize)))} <span class="hint">(${esc(fmtN(Math.round(pxSize)))} ${esc(L('plants / palox d\'après tes chauffes','plantas / palox según tus calefacciones'))})</span></dd>`:''}<dt>${esc(L('À planter','A plantar'))}</dt><dd>${esc(fmtN(plantes))}</dd></dl>`:`<p class="note">${esc(L('Indique le nombre de plants vendables voulus.','Indica el número de plantas vendibles deseadas.'))}</p>`}
    </div></section>`;
  $('pn-back').onclick=()=>go('prod');
  const upd=()=>{ P.variete=$('pn-v').value.trim(); P.pg=$('pn-p').value.trim(); P.cible=$('pn-c').value.trim(); P.casse=$('pn-k').value.trim(); app.querySelectorAll('[data-r]').forEach(i=>P['r_'+i.dataset.r]=i.value.trim()); const a=document.activeElement&&document.activeElement.id, ar=document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.r; renderPlan(); const f=a?$(a):(ar?app.querySelector('[data-r="'+ar+'"]'):null); if(f){ f.focus(); const v=f.value; f.value=''; f.value=v; } };
  ['pn-v','pn-p','pn-c','pn-k'].forEach(id=>$(id).onchange=upd); app.querySelectorAll('[data-r]').forEach(i=>i.onchange=upd);
}

/* ====================================================================
   RÉSUMÉ, CSV, PARTAGE, IMPORT (fusion)
   ==================================================================== */
function slug(s){ return String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase()||'chauffe'; }
function summary(ch){
  const out=[ch.nom+' — '+ch.duree+' jours, fin prévue J'+ch.finDe+'–J'+ch.finA+(ch.debut?' (début '+dayLabel(ch,1)+')':''),''];
  for(let j=1;j<=ch.duree;j++){ if(!dayFilled(ch.id,j)) continue; const ents=dayEntries(ch.id,j);
    out.push('J'+j+(ch.debut?' · '+dayLabel(ch,j):''));
    ents.filter(e=>e.type==='releve'&&e.source!=='capteur').sort((a,b)=>(a.heure||'').localeCompare(b.heure||'')).forEach(r=>out.push('  T° '+(r.heure?fmtH(r.heure):L('heure ?','hora ?'))+' · '+L('pièce ','sala ')+(r.tExt!=null?fmtN(r.tExt)+' °C':'—')+' · palox '+(r.tInt!=null?fmtN(r.tInt)+' °C':'—')+(humText(r)?' · '+humText(r):'')+' ('+authorName(r)+')'+(r.thermos&&r.thermos.length?'\n    '+thermoText(r):'')));
    const cps=ents.filter(e=>e.type==='releve'&&e.source==='capteur'); if(cps.length){ const ti=cps.map(r=>r.tInt).filter(v=>v!=null), te=cps.map(r=>r.tExt).filter(v=>v!=null), rg=a=>fmtN(Math.min(...a))+'–'+fmtN(Math.max(...a)); out.push('  '+L('Capteur','Sensor')+' : '+plural(cps.length,'mesure','mesures','medición','mediciones')+(te.length?' · '+L('pièce ','sala ')+rg(te)+' °C':'')+(ti.length?' · palox '+rg(ti)+' °C':'')+(rngTxt(cps.map(hOut),' %')?' · '+L('HR pièce ','HR sala ')+rngTxt(cps.map(hOut),' %'):'')+(rngTxt(cps.map(hIn),' %')?' · HR palox '+rngTxt(cps.map(hIn),' %'):'')); }
    const tal=dayTempAlerts(ch, dayStats(ch)[j-1]); if(tal.length) out.push('  ⚠ '+tal.join(' ; '));

  if(lots.length){ out.push('','Contrôles par lot'); lots.forEach(r=>out.push('  J'+r.jour+' · Lot '+r.lot+((r.variete||r.pg)?' ('+[r.variete,r.pg].filter(Boolean).join('/')+')':'')+(r.nb?' · '+r.nb+' plants':'')+LOT_KEYS.filter(k=>r[k]).map(k=>' · '+OPTS[k].label+' : '+r[k]).join('')+(r.remarque?' · '+r.remarque:'')+' ('+authorName(r)+')')); }

  out.push(...accSummaryLines(ch));

}

async function shareFile(file, st, okMsg){
  try{ if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:file.name}); st.textContent=okMsg; st.className='status ok'; return; } }
  catch(e){ if(e && e.name==='AbortError'){ st.textContent='Partage annulé.'; st.className='status'; return; } }
  const u=URL.createObjectURL(file); const a=document.createElement('a'); a.href=u; a.download=file.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),5000);
  st.textContent=okMsg+' (téléchargé)'; st.className='status ok';
}
const blobToData=b=>new Promise(ok=>{ const r=new FileReader(); r.onload=()=>ok(r.result); r.readAsDataURL(b); });
async function exportAll(st){
  st.textContent='Préparation du fichier…'; st.className='status';
  try{
    const photos={}; const ids=new Set();
    S.entrees.filter(e=>!e.supprime).forEach(e=>{ if(e.photoId) ids.add(e.photoId); (e.photos||[]).forEach(id=>ids.add(id)); });
    for(const id of ids){ const b=await DB.get('photos',id); if(b) photos[id]=await blobToData(b); }
    const data={format:EXPORT_FORMAT, version:2, exportePar:S.me.nom, exporteLe:nowIso(), chauffes:S.chauffes, entrees:S.entrees, photos};
    const d=new Date(); const name='notes-chauffes-'+slug(S.me.nom)+'-'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.json';
    await shareFile(new File([JSON.stringify(data)], name, {type:'application/json'}), st, 'Fichier prêt.');
  }catch(e){ st.textContent='Export impossible.'; st.className='status err'; }
}
async function importFile(e, st){
  const f=e.target.files[0]; e.target.value=''; if(!f) return;
  st.textContent='Lecture du fichier…'; st.className='status';
  try{
    const j=JSON.parse(await f.text());
    if(!j || (j.format!=='journal-chauffes' && j.format!==EXPORT_FORMAT)){ st.textContent='Ce fichier ne vient pas du Journal de chauffes.'; st.className='status err'; return; }
    let nc=0, ne=0, np=0;
    const newer=(a,b)=>!a || (b.majLe||'')>(a.majLe||'');
    for(const c of j.chauffes||[]){ const ex=S.chauffes.find(x=>x.id===c.id); if(newer(ex,c)){ await DB.put('chauffes',c); if(ex) Object.assign(ex,c); else S.chauffes.push(c); Sync.mark('chauffe',c.id); nc++; } }
    const batch=[];
    for(const en of j.entrees||[]){ const ex=S.entrees.find(x=>x.id===en.id); if(newer(ex,en)){ batch.push(en); if(ex) Object.assign(ex,en); else S.entrees.push(en); Sync.mark('entree',en.id); ne++; } }
    if(batch.length) await DB.putMany('entrees',batch);
    for(const [id,u] of Object.entries(j.photos||{})){ const ex=await DB.get('photos',id); if(!ex){ const b=await (await fetch(u)).blob(); await DB.put('photos',b,id); np++; } }
    st.textContent=(nc||ne||np)?`Importé : ${ne} note${ne>1?'s':''}, ${nc} chauffe${nc>1?'s':''}, ${np} photo${np>1?'s':''}${j.exportePar?' (de '+j.exportePar+')':''}.`:'Rien de nouveau dans ce fichier : tout y était déjà.';
    st.className='status ok'; toast('Import terminé.');
    setTimeout(render,1200);
  }catch(err){ st.textContent='Fichier illisible ou stockage plein.'; st.className='status err'; }
}

(async function start(){

  { const st=document.createElement('style'); st.textContent=REG_CSS; document.head.appendChild(st); }

  try{ await loadAll(); document.documentElement.lang=S.lang; await Sync.load(); }catch(e){ app.innerHTML='<div class="banner" style="margin-top:20px">Le stockage de ce navigateur est bloqué (navigation privée ?). Ouvre l\'app normalement pour enregistrer tes notes.</div>'; return; }
  if(S.me && S.hashCode && SYNC_AVAILABLE && !Sync.code){ await Sync.setCode(S.hashCode); toast('Code d\'équipe enregistré : partage automatique activé.'); }
  try{ S._wnom=sessionStorage.getItem(LS+'wnom')||''; const v=sessionStorage.getItem(LS+'view'); if(v==='settings' && S.me) S.view='settings'; sessionStorage.removeItem(LS+'wnom'); sessionStorage.removeItem(LS+'view'); }catch(e){}
  render();
  if(Sync.active()) Sync.schedule(600);
})();
/* L'app d'origine (même adresse github.io) peut effacer nos fichiers hors ligne quand elle se met à jour :
   on vérifie au démarrage et on les remet en cache si besoin. */
async function ensureShell(){ try{ if(!('caches' in window) || !navigator.onLine) return; const V='chauffes-pro-v'+APP_VERSION; const c=await caches.open(V); const hit=await c.match(new URL('index.html',location.href).href,{ignoreSearch:true}); if(!hit) await c.addAll(['./','./index.html','./manifest.webmanifest','./icon-192.png','./icon-512.png','./icon-512-maskable.png','./apple-touch-icon.png']); }catch(e){} }
if(location.protocol!=='file:') setTimeout(ensureShell, 4000);
if('serviceWorker' in navigator && location.protocol!=='file:'){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    reg.addEventListener('updatefound',()=>{ const w=reg.installing; if(!w) return; w.addEventListener('statechange',()=>{ if(w.state==='installed' && navigator.serviceWorker.controller){ const b=document.createElement('div'); b.className='banner'; b.style.margin='10px 16px'; b.innerHTML='<span>Une nouvelle version de l\'app est prête.</span>'; const btn=document.createElement('button'); btn.className='ghost'; btn.textContent='Recharger'; btn.onclick=()=>location.reload(); b.appendChild(btn); document.body.prepend(b); } }); });
  }).catch(()=>{});
}
